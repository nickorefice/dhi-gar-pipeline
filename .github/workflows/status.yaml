name: Pipeline status

# On-demand tracking dashboard: regenerates STATUS.md (per sync-config.yaml
# entry: latest upstream digest, what prod serves, quarantine state) and shows
# it in the run summary. The sync workflow's own status job keeps the
# committed STATUS.md fresh after every poll/run; this exists for the instant
# check in between:
#
#   make status                # regenerate + commit
#   gh workflow run status.yaml                    # summary only
#   gh workflow run status.yaml -f commit=true     # regenerate + commit

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit the regenerated STATUS.md when it changed"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  status:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GAR_LOCATION: ${{ vars.GAR_LOCATION }}
      GAR_QUARANTINE_REPO: ${{ vars.GAR_QUARANTINE_REPO }}
      GAR_PROD_REPO: ${{ vars.GAR_PROD_REPO }}
      DOCKERHUB_ORG: ${{ vars.DOCKERHUB_ORG }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PAT: ${{ secrets.DOCKERHUB_PAT }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub (DHI mirrors are private)
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Install regctl
        uses: ./.github/actions/install-tools
        with:
          tools: regctl

      - name: Authenticate to GCP (WIF)
        uses: ./.github/actions/gar-auth
        with:
          workload-identity-provider: ${{ vars.WIF_PROVIDER }}
          service-account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Regenerate STATUS.md
        uses: ./.github/actions/status
        with:
          commit: ${{ inputs.commit && 'true' || 'false' }}
