name: Inspect DHI referrers

# Diagnostic, on demand only. Answers "where does DHI actually keep the
# attestations for this tag, and of what type?" without touching GAR or
# running any gate. Replaces the old local-only `make inspect`:
#
#   gh workflow run inspect-referrers.yaml -f repo=dhi-node -f tag=26-debian13
#   gh run watch

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repository under the Hub org (e.g. dhi-node)"
        required: true
        default: dhi-node
      tag:
        description: "Tag to inspect. DHI publishes no 'latest'"
        required: true
        default: 26-debian13

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_ORG: ${{ vars.DOCKERHUB_ORG }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PAT: ${{ secrets.DOCKERHUB_PAT }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub (DHI mirrors are private)
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Install regctl + docker scout
        uses: ./.github/actions/install-tools
        with:
          tools: regctl scout

      - name: Inspect where the attestations really are
        uses: ./.github/actions/inspect-referrers
        with:
          repo: ${{ inputs.repo }}
          tag: ${{ inputs.tag }}

      - name: Upload raw probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspect-${{ inputs.repo }}-${{ inputs.tag }}
          path: out/**/inspect/
          if-no-files-found: warn
          retention-days: 14
