name: Sync DHI to GAR

# Triggers:
#   schedule            -- THE POC'S OPERATIVE TRIGGER: a daily poll. The plan job
#                          runs the pipeline library's check_current (two HEAD requests per
#                          tag) and builds a matrix of only the tags whose
#                          upstream digest differs from prod, so an all-current
#                          day costs one short plan job (~1 min) and the full
#                          pipeline runs only when something actually changed.
#                          Worst-case latency is ~24h; tighten the cron (e.g.
#                          "7,37 * * * *" for 30-min polls, ~1,450 Actions
#                          min/month) or deploy the relay if that matters. Note
#                          GitHub disables schedules after 60 days of repository
#                          inactivity -- re-enable in the Actions UI.
#   repository_dispatch -- event-driven path via the Docker Hub webhook relay
#                          (relay/README.md). Built and validated end to end, but
#                          NOT deployed for this POC: daily latency is acceptable
#                          here, and it avoids a public endpoint.
#   workflow_dispatch   -- on demand, for the demo and one-off syncs.
#
# Structure: this file is orchestration only -- triggers, concurrency, and the
# plan -> sync fan-out. THE PIPELINE LOGIC LIVES IN THE ACTION YAMLS: each step
# is a composite action under .github/actions/ carrying its stage's full bash
# body, and the plumbing they share (config, auth, run manifest, gate
# lifecycle, verify/check-current/gate-check bodies) is the library embedded in
# .github/actions/pipeline-env/action.yaml. The offline tests extract and
# source that same library text, so what is tested is what runs. Only the jq
# programs (scripts/lib/*.jq) and attestation-types.json remain on disk as
# shared data files.

on:
  repository_dispatch:
    types: [dhi-tag-pushed]
  workflow_dispatch:
    inputs:
      repo:
        description: "Repository under the Hub org (e.g. dhi-node)"
        required: true
        default: dhi-node
      tag:
        description: "Tag to sync. DHI publishes no 'latest' (e.g. 26-debian13)"
        required: true
        default: 26-debian13
      require_vex:
        description: "Fail verification if OpenVEX is absent (Alpine DHI has none)"
        type: boolean
        default: false
      skip_vex:
        description: "NEGATIVE TEST: scan without VEX so the gate blocks promotion"
        type: boolean
        default: false
      poll:
        description: "Run the SCHEDULED POLL path instead: check every sync-config tag against prod, sync only what changed. Ignores repo/tag/require_vex/skip_vex. Exists because schedule events cannot be fired by hand, and an untestable branch is an unverified one."
        type: boolean
        default: false
  schedule:
    # Daily, 07:15 UTC. Off the hour on purpose: hourly boundaries are when every
    # other scheduled job in the world contends for runners.
    - cron: "15 7 * * *"

concurrency:
  # Serialise per repo+tag. Two runs promoting the same tag concurrently could
  # interleave a verified digest with a different one being copied.
  #
  # client_payload is included so webhook-driven runs for DIFFERENT tags proceed in
  # parallel. Keying only on inputs would collapse every webhook delivery into one
  # group and serialise unrelated tags behind each other.
  group: >-
    sync-dhi-${{ github.event.inputs.repo || github.event.client_payload.repo || 'scheduled' }}-${{
    github.event.inputs.tag || github.event.client_payload.tag || 'all' }}
  cancel-in-progress: false

permissions:
  contents: read
  # Required for Workload Identity Federation. This is the whole reason no GCP
  # service-account key exists anywhere in this repo or its secrets.
  id-token: write

jobs:
  # A scheduled run fans out over sync-config.yaml; a dispatch run handles one tag.
  # Building the matrix in a separate job keeps the tag list reviewable as data.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      count: ${{ steps.build.outputs.count }}
    env:
      # For check_current on the poll path. Non-secret identifiers except the
      # Hub credential; useless without an OIDC token from this repo.
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GAR_LOCATION: ${{ vars.GAR_LOCATION }}
      GAR_PROD_REPO: ${{ vars.GAR_PROD_REPO }}
      DOCKERHUB_ORG: ${{ vars.DOCKERHUB_ORG }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PAT: ${{ secrets.DOCKERHUB_PAT }}
    steps:
      - uses: actions/checkout@v4

      # Scheduled ticks compare digests before deciding anything, which needs
      # regctl and a GAR token. Dispatch-driven runs skip these steps -- they
      # were asked for explicitly and always run.
      - name: Login to Docker Hub (poll path only -- DHI mirrors are private)
        if: github.event_name == 'schedule' || inputs.poll == true
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Install regctl (poll path only)
        if: github.event_name == 'schedule' || inputs.poll == true
        uses: ./.github/actions/install-tools
        with:
          tools: regctl

      - name: Authenticate to GCP (WIF, poll path only)
        if: github.event_name == 'schedule' || inputs.poll == true
        uses: ./.github/actions/gar-auth
        with:
          workload-identity-provider: ${{ vars.WIF_PROVIDER }}
          service-account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - id: build
        name: Build the tag matrix
        uses: ./.github/actions/plan-matrix
        with:
          event-name: ${{ github.event_name }}
          repo: ${{ github.event.inputs.repo }}
          tag: ${{ github.event.inputs.tag }}
          require-vex: ${{ github.event.inputs.require_vex || 'false' }}
          skip-vex: ${{ github.event.inputs.skip_vex || 'false' }}
          poll: ${{ github.event.inputs.poll || 'false' }}
          dispatch-repo: ${{ github.event.client_payload.repo }}
          dispatch-tag: ${{ github.event.client_payload.tag }}

  sync:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # one tag failing its gate must not cancel the others
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      # Repo variables, written by `make gh-vars` from the Terraform outputs.
      # Non-secret identifiers: useless without an OIDC token from this repo.
      # The stage actions' library reads this environment the same way it reads
      # config.env locally; per-tag values (REPO, TAG) arrive as action inputs.
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GAR_LOCATION: ${{ vars.GAR_LOCATION }}
      GAR_QUARANTINE_REPO: ${{ vars.GAR_QUARANTINE_REPO }}
      GAR_PROD_REPO: ${{ vars.GAR_PROD_REPO }}
      EVIDENCE_BUCKET: ${{ vars.EVIDENCE_BUCKET }}
      DOCKERHUB_ORG: ${{ vars.DOCKERHUB_ORG }}
      # The Docker Hub credential is the only long-lived secret in the pipeline.
      # For an Organization Access Token the username is the ORG name, not a
      # personal handle -- authenticating as a user fails with a bare
      # "unauthorized" that reads like a permissions problem.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PAT: ${{ secrets.DOCKERHUB_PAT }}
      TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2

    steps:
      - uses: actions/checkout@v4

      # regctl and trivy run from the org's mirrored DHI images behind
      # transparent wrappers -- the tools that gate the images carry the same
      # provenance story as the images they gate. The mirrors are private, so
      # docker authenticates first (natively, not via shell). Version pins
      # live in the install-tools action's input defaults.
      - name: Login to Docker Hub (DHI mirrors are private)
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Install pinned toolchain
        uses: ./.github/actions/install-tools
        with:
          tools: regctl trivy scout

      # GCP auth via Workload Identity Federation. No service-account key.
      # gcloud is included for the evidence-export stage.
      - name: Authenticate to GCP (WIF)
        uses: ./.github/actions/gar-auth
        with:
          workload-identity-provider: ${{ vars.WIF_PROVIDER }}
          service-account: ${{ vars.WIF_SERVICE_ACCOUNT }}
          setup-gcloud: "true"

      # ---------------------------------------------------------------------
      # Pipeline. One composite action per stage; each wraps the script a
      # developer runs locally.
      # ---------------------------------------------------------------------
      - name: 00 Resolve tag to digest
        uses: ./.github/actions/resolve
        with:
          repo: ${{ matrix.repo }}
          tag: ${{ matrix.tag }}

      - name: 10 Sync to quarantine (image + referrers)
        uses: ./.github/actions/sync
        with:
          repo: ${{ matrix.repo }}
          tag: ${{ matrix.tag }}

      - name: 20 Verify gate (attestations survived, digest unchanged)
        uses: ./.github/actions/verify
        with:
          repo: ${{ matrix.repo }}
          tag: ${{ matrix.tag }}
          require-vex: ${{ matrix.requireVex }}

      - name: 30 Scan gate (Trivy with VEX)
        uses: ./.github/actions/scan
        with:
          repo: ${{ matrix.repo }}
          tag: ${{ matrix.tag }}
          skip-vex: ${{ matrix.skipVex }}

      # Held tags (sync-config.yaml hold list) stop here, green: sync and both
      # gates ran; promotion is withheld by policy. Skipping the step keeps the
      # run legible; the promote gate itself ALSO refuses held tags, so a
      # re-run of this step alone cannot slip one through.
      - name: 40 Promote to prod
        if: matrix.hold != true
        uses: ./.github/actions/promote
        with:
          repo: ${{ matrix.repo }}
          tag: ${{ matrix.tag }}

      # Evidence is exported even when a gate failed: "we caught this and stopped"
      # is exactly what an auditor needs to see, and an empty bucket is
      # indistinguishable from a gate that never ran.
      - name: 50 Export evidence
        if: always()
        uses: ./.github/actions/export-evidence
        with:
          repo: ${{ matrix.repo }}
          tag: ${{ matrix.tag }}
          hold: ${{ matrix.hold }}

      - name: Upload reports as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.repo }}-${{ matrix.tag }}
          path: |
            out/**/run-manifest.json
            out/**/verify-report*.json
            out/**/scan-report.json
            out/**/trivy-report*.json
            out/**/scout-compare.txt
            out/**/inventory-*.json
            out/**/evidence/manifest.json
          if-no-files-found: warn
          retention-days: 30

      # A failed gate must be legible from the run summary alone, without
      # anyone opening logs or downloading an artifact.
      - name: Explain a failure in the job summary
        if: failure()
        env:
          REPO: ${{ matrix.repo }}
          TAG: ${{ matrix.tag }}
        run: |
          {
            echo "### ❌ \`${REPO}:${TAG}\` did not reach prod"
            echo
            m="out/${REPO}/$(echo "$TAG" | tr -c 'A-Za-z0-9._-' '_')/run-manifest.json"
            if [[ -f "$m" ]]; then
              echo "| Stage | Status |"
              echo "|---|---|"
              jq -r '.stages | to_entries[] | "| \(.key) | \(.value.status // "not run") |"' "$m"
              echo
              echo "Digest: \`$(jq -r '.source.indexDigest' "$m")\`"
              echo
              missing="$(jq -r '.gates.verify.groupsMissing // [] | join(", ")' "$m")"
              [[ -n "$missing" ]] && echo "Missing attestation groups: **$missing**"
              gating="$(jq -r '.gates.scan.trivy.gatingFindings // "n/a"' "$m")"
              echo "Un-VEXed HIGH/CRITICAL: **$gating**"
            else
              echo "No run manifest was produced -- the failure occurred during resolve."
            fi
            echo
            echo "The image remains in quarantine and was **not** promoted."
          } >>"$GITHUB_STEP_SUMMARY"

  # Refresh STATUS.md -- the tracking dashboard -- after every run that got as
  # far as planning. `always()` on purpose: a failed or held gate is exactly
  # when the dashboard should change (a tag flips to `blocked`/`held-*`), and
  # an empty matrix still deserves a fresh "Updated:" stamp so a quiet poll is
  # distinguishable from a dead one.
  status:
    needs: [plan, sync]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commits STATUS.md when it changed
      id-token: write   # WIF, to read the GAR digests
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GAR_LOCATION: ${{ vars.GAR_LOCATION }}
      GAR_QUARANTINE_REPO: ${{ vars.GAR_QUARANTINE_REPO }}
      GAR_PROD_REPO: ${{ vars.GAR_PROD_REPO }}
      DOCKERHUB_ORG: ${{ vars.DOCKERHUB_ORG }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PAT: ${{ secrets.DOCKERHUB_PAT }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub (DHI mirrors are private)
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Install regctl
        uses: ./.github/actions/install-tools
        with:
          tools: regctl

      - name: Authenticate to GCP (WIF)
        uses: ./.github/actions/gar-auth
        with:
          workload-identity-provider: ${{ vars.WIF_PROVIDER }}
          service-account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Regenerate and commit STATUS.md
        uses: ./.github/actions/status
        with:
          commit: "true"
