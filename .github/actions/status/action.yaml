name: Pipeline status
description: >-
  Regenerate STATUS.md -- the tracking dashboard for every sync-config.yaml
  entry: latest upstream digest, what prod serves, what sits in quarantine,
  and a state classification (current / stale / blocked / held-* / missing)
  from the library's report_status. The file is a DERIVED VIEW committed for
  convenience and diffable history; the registry is authoritative. Also
  writes the same table to the run summary. With commit: 'true' the changed
  file is committed back as github-actions[bot] (caller needs
  contents: write); an unchanged dashboard commits nothing.
inputs:
  commit:
    description: "'true' commits STATUS.md back to the current branch when it changed"
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: ./.github/actions/pipeline-env
    - shell: bash
      run: |
        set -euo pipefail
        # shellcheck disable=SC1091
        source "$RUNNER_TEMP/dhi-pipeline-lib.sh"

        # The -e toggle, as in plan-matrix: capturing in a condition would
        # suppress errexit inside report_status.
        set +e
        status_json="$(set -e; report_status)"
        rc=$?
        set -e
        if (( rc != 0 )); then
          echo "::warning title=status::one or more upstream digests could not be resolved -- the dashboard may be partial; a dead Hub credential would freeze it silently"
        fi
        [[ -n "$status_json" ]] || die "report_status produced no output"

        run_link=""
        [[ -n "${GITHUB_RUN_ID:-}" ]] && run_link="${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY:-}/actions/runs/${GITHUB_RUN_ID}"

        # Upstream and prod digests are written IN FULL -- "what is the latest
        # digest for this tag" and "what exactly does prod serve" are the two
        # questions this file exists to answer, and GAR consumers deploy by
        # digest. Quarantine is context, so it is truncated.
        {
          echo "# Pipeline status"
          echo
          echo "> **Generated file — do not edit.** Regenerated by CI (the sync run's"
          echo "> status job, or the status workflow). Derived view for tracking only:"
          echo "> the registry is authoritative, and verification is only meaningful"
          echo "> against the OCI referrers attached to the digests below."
          echo
          echo "Updated: $(_ts)${run_link:+ · [run]($run_link)}"
          echo
          echo "| Image | Tag | State | Upstream digest (latest) | Prod digest (served) | Quarantine | VEX req | Hold |"
          echo "|---|---|---|---|---|---|---|---|"
          jq -r '.[] | "| " + .repo + " | " + .tag + " | "
                 + (if   .state == "current"      then "✅ current"
                    elif .state == "stale"        then "🔄 stale"
                    elif .state == "blocked"      then "⛔ blocked"
                    elif .state == "held-current" then "✋ held-current"
                    elif .state == "held-stale"   then "✋ held-stale"
                    elif .state == "missing"      then "▫️ missing"
                    else "❓ " + .state end)
                 + " | `" + (.upstreamDigest // "—") + "`"
                 + " | `" + (.prodDigest // "—") + "`"
                 + " | `" + ((.quarantineDigest // "—") | .[0:19]) + "`"
                 + " | " + (.requireVex | tostring)
                 + " | " + (if .hold then "✋" else "—" end) + " |"' <<<"$status_json"
          echo
          echo "**States:** \`current\` prod serves the latest upstream digest · \`stale\` behind"
          echo "upstream, the next poll acts · \`blocked\` synced but a gate refused promotion ·"
          echo "\`held-*\` on the sync-config.yaml hold list (syncs and gates, never promoted) ·"
          echo "\`missing\` not synced yet."
        } >"$REPO_ROOT/STATUS.md"
        log "wrote STATUS.md"

        if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
          cat "$REPO_ROOT/STATUS.md" >>"$GITHUB_STEP_SUMMARY"
        fi

    - if: inputs.commit == 'true'
      shell: bash
      run: |
        set -euo pipefail
        git add STATUS.md
        if git diff --cached --quiet; then
          echo "STATUS.md unchanged -- nothing to commit"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -m "status: update STATUS.md [generated]"
        # Concurrent runs can race the push; rebase and retry rather than fail
        # a pipeline run over a dashboard commit. In a rebase, -X theirs keeps
        # the commit being replayed -- i.e. THIS run's STATUS.md -- on conflict,
        # which is right: it was generated moments ago.
        n=0
        until git push; do
          n=$((n + 1))
          if (( n >= 3 )); then
            echo "::warning title=status::could not push STATUS.md after 3 attempts -- a concurrent run likely owns the update"
            exit 0
          fi
          git pull --rebase -X theirs
        done
