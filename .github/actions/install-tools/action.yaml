name: Install pipeline tools
description: >-
  Install the pinned toolchain. regctl, trivy, and cosign run FROM THE ORG'S
  MIRRORED DHI IMAGES (docker.io/<org>/dhi-regctl, dhi-trivy, dhi-cosign),
  not GitHub release binaries: the pipeline's own tools get the same
  provenance, SBOM, and signed-attestation story as the images they gate, and
  a -fips variant is one input override away. A thin /usr/local/bin/<tool>
  wrapper docker-runs each image, so every call site (the pipeline library,
  the stage actions) is unchanged. docker scout (a CLI plugin, needs the
  docker CLI) and regsync (no DHI image exists) still come from upstream
  release binaries, pinned here as input defaults. Selection via the `tools`
  input keeps the scheduled poll cheap: its plan job needs only regctl.
  (Locally, `make tools` installs via Homebrew on macOS.)
inputs:
  tools:
    description: >-
      Space-separated subset of "regctl trivy cosign regsync scout".
      The default is what the sync job needs; the poll path passes just
      "regctl".
    required: false
    default: regctl trivy scout
  regctl-image:
    description: >-
      Image for the regctl wrapper. Empty derives
      docker.io/$DOCKERHUB_ORG/dhi-regctl:0.11.5 from the job environment.
      Override to pin a variant (e.g. ...:0.11.5-fips) or a digest.
    required: false
    default: ""
  trivy-image:
    description: >-
      Image for the trivy wrapper. Empty derives
      docker.io/$DOCKERHUB_ORG/dhi-trivy:0.73.0.
    required: false
    default: ""
  cosign-image:
    description: >-
      Image for the cosign wrapper. Empty derives
      docker.io/$DOCKERHUB_ORG/dhi-cosign:3.1.3.
    required: false
    default: ""
  regclient-version:
    description: regclient release, used for the regsync binary only (regctl comes from the DHI image)
    required: false
    default: v0.11.5
  scout-version:
    description: docker scout CLI plugin release (no leading v)
    required: false
    default: 1.24.0
runs:
  using: composite
  steps:
    - shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
        REGCTL_IMAGE: ${{ inputs.regctl-image }}
        TRIVY_IMAGE: ${{ inputs.trivy-image }}
        COSIGN_IMAGE: ${{ inputs.cosign-image }}
        REGCLIENT_VERSION: ${{ inputs.regclient-version }}
        SCOUT_VERSION: ${{ inputs.scout-version }}
      run: |
        set -euo pipefail

        BIN_DIR="${BIN_DIR:-/usr/local/bin}"
        want() { [[ " $TOOLS " == *" $1 "* ]]; }
        log() { printf '%s  %s\n' "$(date -u +%H:%M:%SZ)" "$*" >&2; }

        ARCH="$(uname -m)"
        case "$ARCH" in
          x86_64|amd64) ARCH_GO=amd64 ;;
          arm64|aarch64) ARCH_GO=arm64 ;;
          *) echo "unsupported architecture: $ARCH" >&2; exit 1 ;;
        esac

        TMP="$(mktemp -d)"
        trap 'rm -rf "$TMP"' EXIT
        cd "$TMP"

        install_bin() { # install_bin <src> <name>
          if [[ -w "$BIN_DIR" ]]; then install -m 0755 "$1" "$BIN_DIR/$2"
          else sudo install -m 0755 "$1" "$BIN_DIR/$2"; fi
          log "installed $2 -> $BIN_DIR/$2"
        }

        # -------------------------------------------------------------------
        # DHI-image tools: regctl, trivy, cosign, behind transparent wrappers.
        #
        # Each wrapper runs the container as the host user with the host HOME
        # and working directory mounted at their own paths, so credential
        # stores (~/.regctl, ~/.docker), trivy's DB cache (~/.cache/trivy),
        # and every --output/--vex file under the workspace behave exactly as
        # a host binary would. stdin passes through (-i) because the library
        # logs in with --pass-stdin. TRIVY_* env is forwarded when set --
        # TRIVY_DB_REPOSITORY pins the DB registry and TRIVY_USERNAME/
        # TRIVY_PASSWORD are the library's fallback credentials.
        #
        # No fallback to a release binary on pull failure, deliberately: the
        # point of running the hardened images is the supply chain, and
        # quietly swapping in curl-from-GitHub when the mirror is unreadable
        # would change supply chains without changing any visible outcome. A
        # broken mirror should stop the run and say so.
        # -------------------------------------------------------------------
        install_dhi_wrapper() { # install_dhi_wrapper <name> <image>
          local name="$1" image="$2"
          docker pull -q "$image" >/dev/null \
            || { echo "::error title=dhi-$name pull failed::cannot pull $image -- confirm the workflow ran docker/login-action first, the org mirrors dhi/$name, and the PAT can read it. Deliberately NOT falling back to a GitHub release binary." >&2; exit 1; }
          cat >"$TMP/$name" <<EOF
        #!/usr/bin/env bash
        # $name -- runs the org's mirrored DHI image: $image
        # Written by .github/actions/install-tools; call sites are unchanged.
        set -euo pipefail
        exec docker run --rm -i \\
          --user "\$(id -u):\$(id -g)" \\
          -e HOME="\$HOME" \\
          -e TRIVY_DB_REPOSITORY -e TRIVY_USERNAME -e TRIVY_PASSWORD \\
          -v "\$HOME:\$HOME" \\
          -v "\$PWD:\$PWD" -w "\$PWD" \\
          "$image" "\$@"
        EOF
          install_bin "$TMP/$name" "$name"
          log "$name via DHI image: $image"
        }

        if want regctl || want trivy || want cosign; then
          # Mirrored DHI repos are private. The calling workflow authenticates
          # docker natively with docker/login-action BEFORE this action runs
          # (see sync-dhi.yaml / inspect-referrers.yaml); an unauthenticated
          # pull fails below with an error that says exactly that.
          MIRROR="docker.io/${DOCKERHUB_ORG:-nicksdemoorg}"
          want regctl && install_dhi_wrapper regctl "${REGCTL_IMAGE:-$MIRROR/dhi-regctl:0.11.5}"
          want trivy  && install_dhi_wrapper trivy  "${TRIVY_IMAGE:-$MIRROR/dhi-trivy:0.73.0}"
          want cosign && install_dhi_wrapper cosign "${COSIGN_IMAGE:-$MIRROR/dhi-cosign:3.1.3}"
        fi

        if want regsync; then
          log "regsync $REGCLIENT_VERSION (release binary -- no DHI image exists for regsync)"
          curl -fsSL -o regsync \
            "https://github.com/regclient/regclient/releases/download/${REGCLIENT_VERSION}/regsync-linux-${ARCH_GO}"
          chmod +x regsync; install_bin regsync regsync
        fi

        if want scout; then
          log "docker scout $SCOUT_VERSION (CLI plugin)"
          curl -fsSL -o scout.tgz \
            "https://github.com/docker/scout-cli/releases/download/v${SCOUT_VERSION}/docker-scout_${SCOUT_VERSION}_linux_${ARCH_GO}.tar.gz"
          tar xzf scout.tgz docker-scout
          mkdir -p "$HOME/.docker/cli-plugins"
          install -m 0755 docker-scout "$HOME/.docker/cli-plugins/docker-scout"
          log "installed docker-scout -> $HOME/.docker/cli-plugins/docker-scout"
        fi

        # Print what actually landed, so a version drift is visible in the log
        # rather than only in a scanner's changed verdict.
        for t in $TOOLS; do
          case "$t" in
            regctl|regsync)
              printf '%-8s %s\n' "$t" "$("$t" version 2>/dev/null | awk '/VCSTag/{print $2}')" ;;
            trivy)
              printf '%-8s %s\n' trivy "$(trivy --version 2>/dev/null | head -1 | awk '{print $2}')" ;;
            cosign)
              printf '%-8s %s\n' cosign "$(cosign version 2>/dev/null | awk '/GitVersion:/{print $2}')" ;;
            scout)
              printf '%-8s %s\n' scout "$(docker scout version 2>/dev/null | awk '/version:/{print $2; exit}')" ;;
          esac
        done
