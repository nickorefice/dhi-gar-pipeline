name: Install pipeline tools
description: >-
  Install the pinned toolchain. regctl, docker-scout, cosign, and opa all run
  FROM DOCKER HARDENED IMAGES, not GitHub release binaries: the pipeline's own
  tools get the same provenance, SBOM, and signed-attestation story as the images
  they gate, and a -fips variant is one input override away. A thin
  /usr/local/bin/<tool> wrapper docker-runs each image, so every call site (the
  pipeline library, the stage actions) is unchanged.

  regctl and cosign come from the ORG MIRROR (docker.io/<org>/dhi-*).
  docker-scout and opa come from dhi.io, Docker's own DHI registry, because the
  org does not mirror those two repos -- see the DHI_UPSTREAM comment in the run
  block for the verification and for how to move them onto the mirror. Only
  regsync is not a DHI image at all: none exists (verified, dhi.io/regsync 404s).

  Selection via the `tools` input keeps the scheduled poll cheap: its plan job
  needs only regctl. (Locally, `make tools` installs via Homebrew on macOS.)
inputs:
  tools:
    description: >-
      Space-separated subset of "regctl scout cosign opa regsync".
      The default is what the sync job needs; the poll path passes just
      "regctl". `opa` is for the offline policy tests (tests/test-policy.sh) --
      the scan gate does NOT need it, because `docker-scout policy` embeds OPA
      and evaluates the Rego in-process.
    required: false
    default: regctl scout
  regctl-image:
    description: >-
      Image for the regctl wrapper. Empty derives
      docker.io/$DOCKERHUB_ORG/dhi-regctl:0.11.5 from the job environment.
      Override to pin a variant (e.g. ...:0.11.5-fips) or a digest.
    required: false
    default: ""
  scout-image:
    description: >-
      Image for the docker-scout wrapper. Empty uses dhi.io/scout-cli:1.23.1 --
      Docker's own DHI registry, NOT the org mirror, because the org does not
      mirror this repo (see the comment on DHI_UPSTREAM below). Once
      `docker dhi mirror start scout-cli` has run, set this to
      docker.io/<org>/dhi-scout-cli:1.23.1.
    required: false
    default: ""
  cosign-image:
    description: >-
      Image for the cosign wrapper. Empty derives
      docker.io/$DOCKERHUB_ORG/dhi-cosign:3.1.3.
    required: false
    default: ""
  opa-image:
    description: >-
      Image for the opa wrapper. Empty uses
      dhi.io/open-policy-agent:1.19.1 -- Docker's own DHI registry, not the org
      mirror, for the same reason as scout-image.
    required: false
    default: ""
  regclient-version:
    description: regclient release, used for the regsync binary only (regctl comes from the DHI image)
    required: false
    default: v0.11.5
runs:
  using: composite
  steps:
    - shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
        REGCTL_IMAGE: ${{ inputs.regctl-image }}
        SCOUT_IMAGE: ${{ inputs.scout-image }}
        COSIGN_IMAGE: ${{ inputs.cosign-image }}
        OPA_IMAGE: ${{ inputs.opa-image }}
        REGCLIENT_VERSION: ${{ inputs.regclient-version }}
      run: |
        set -euo pipefail

        BIN_DIR="${BIN_DIR:-/usr/local/bin}"
        want() { [[ " $TOOLS " == *" $1 "* ]]; }
        log() { printf '%s  %s\n' "$(date -u +%H:%M:%SZ)" "$*" >&2; }

        ARCH="$(uname -m)"
        case "$ARCH" in
          x86_64|amd64) ARCH_GO=amd64 ;;
          arm64|aarch64) ARCH_GO=arm64 ;;
          *) echo "unsupported architecture: $ARCH" >&2; exit 1 ;;
        esac

        TMP="$(mktemp -d)"
        trap 'rm -rf "$TMP"' EXIT
        cd "$TMP"

        install_bin() { # install_bin <src> <name>
          if [[ -w "$BIN_DIR" ]]; then install -m 0755 "$1" "$BIN_DIR/$2"
          else sudo install -m 0755 "$1" "$BIN_DIR/$2"; fi
          log "installed $2 -> $BIN_DIR/$2"
        }

        # -------------------------------------------------------------------
        # DHI-image tools: regctl, docker-scout, cosign, opa, behind
        # transparent wrappers.
        #
        # Each wrapper runs the container as the host user with the host HOME
        # and working directory mounted at their own paths, so credential
        # stores (~/.regctl, ~/.docker), caches, and every --output /
        # --result-file / --policy-dir path under the workspace behave exactly
        # as a host binary would. Per-tool env is forwarded via the third
        # argument -- docker-scout in particular needs the proxy variables,
        # because its CVE matching is a live call to api.dso.docker.com and a
        # proxy-less container in a restricted-egress environment fails there
        # rather than anywhere obvious.
        #
        # Registry auth is NOT passed as env: the library's login_dockerhub /
        # login_gar run `docker login`, which writes ~/.docker/config.json, and
        # that file is visible to the container because HOME is mounted. That
        # is the documented way docker-scout picks up credentials.
        #
        # stdin is attached (-i) ONLY when the arguments say the tool will
        # read it (--pass-stdin). `docker run -i` consumes the caller's stdin
        # unconditionally, so an always-on -i makes the first wrapped call
        # inside a `while read` loop swallow the loop's remaining input --
        # observed in production as STATUS.md and the poll silently shrinking
        # to their first config entry.
        #
        # No fallback to a release binary on pull failure, deliberately: the
        # point of running the hardened images is the supply chain, and
        # quietly swapping in curl-from-GitHub when the mirror is unreadable
        # would change supply chains without changing any visible outcome. A
        # broken mirror should stop the run and say so.
        # -------------------------------------------------------------------
        install_dhi_wrapper() { # install_dhi_wrapper <name> <image> [env-vars...]
          local name="$1" image="$2"; shift 2
          local e env_flags=""
          for e in "$@"; do env_flags+=" -e $e"; done

          docker pull -q "$image" >/dev/null \
            || { echo "::error title=dhi-$name pull failed::cannot pull $image -- confirm the workflow ran docker/login-action first, the org mirrors dhi/$name, and the PAT can read it. Deliberately NOT falling back to a GitHub release binary." >&2; exit 1; }
          cat >"$TMP/$name" <<EOF
        #!/usr/bin/env bash
        # $name -- runs the org's mirrored DHI image: $image
        # Written by .github/actions/install-tools; call sites are unchanged.
        set -euo pipefail
        # Attach stdin only when the tool will actually read it: docker run -i
        # consumes the caller's stdin unconditionally, which makes the first
        # wrapped call inside a \`while read\` loop swallow the loop's input.
        interactive=()
        for a in "\$@"; do
          [[ "\$a" == "--pass-stdin" ]] && interactive=(-i)
        done
        exec docker run --rm \${interactive[@]+"\${interactive[@]}"} \\
          --user "\$(id -u):\$(id -g)" \\
          -e HOME="\$HOME" \\
         ${env_flags} \\
          -v "\$HOME:\$HOME" \\
          -v "\$PWD:\$PWD" -w "\$PWD" \\
          "$image" "\$@"
        EOF
          install_bin "$TMP/$name" "$name"
          log "$name via DHI image: $image"
        }

        if want regctl || want scout || want cosign || want opa; then
          # Mirrored DHI repos are private. The calling workflow authenticates
          # docker natively with docker/login-action BEFORE this action runs
          # (see sync-dhi.yaml / inspect-referrers.yaml); an unauthenticated
          # pull fails below with an error that says exactly that.
          MIRROR="docker.io/${DOCKERHUB_ORG:-nicksdemoorg}"

          # TWO DHI SOURCES, and the split is deliberate rather than sloppy.
          #
          # regctl and cosign come from the ORG MIRROR, which is the preferred
          # path: the org controls it and has entitlement to it. scout-cli and
          # open-policy-agent come from dhi.io, Docker's own DHI registry,
          # because THE ORG DOES NOT MIRROR THEM -- verified against the live
          # registry, where nicksdemoorg/dhi-regctl lists 72 tags while
          # nicksdemoorg/dhi-scout-cli and .../dhi-open-policy-agent do not
          # exist at all. Defaulting them to the mirror would make every run
          # fail at this step.
          #
          # These are still Docker Hardened Images, carrying the same signed
          # provenance and SBOMs; dhi.io publishes them with
          # com.docker.dhi.entitlement=public, so an anonymous pull works. The
          # source is named explicitly per tool rather than being a silent
          # fallback, because a wrapper that quietly changed registries when a
          # pull failed would change supply chains without changing any visible
          # outcome -- the same reason there is no fallback to a GitHub release
          # binary.
          #
          # To move them onto the mirror, run `docker dhi mirror start scout-cli`
          # (and open-policy-agent) for the org, then pass scout-image /
          # opa-image, or flip these defaults.
          DHI_UPSTREAM="dhi.io"

          want regctl && install_dhi_wrapper regctl "${REGCTL_IMAGE:-$MIRROR/dhi-regctl:0.11.5}"
          # docker-scout, not "scout": the DHI image's entrypoint is the
          # /docker-scout binary, which is the same binary Docker ships as a
          # CLI plugin. It is installed as a standalone command rather than
          # into ~/.docker/cli-plugins, so call sites invoke `docker-scout ...`
          # and never `docker scout ...` -- there is no plugin here to find.
          want scout  && install_dhi_wrapper docker-scout "${SCOUT_IMAGE:-$DHI_UPSTREAM/scout-cli:1.23.1}" \
                           DOCKER_CONFIG HTTP_PROXY HTTPS_PROXY NO_PROXY http_proxy https_proxy no_proxy
          want cosign && install_dhi_wrapper cosign "${COSIGN_IMAGE:-$MIRROR/dhi-cosign:3.1.3}"
          want opa    && install_dhi_wrapper opa "${OPA_IMAGE:-$DHI_UPSTREAM/open-policy-agent:1.19.1}"
        fi

        if want regsync; then
          log "regsync $REGCLIENT_VERSION (release binary -- no DHI image exists for regsync)"
          curl -fsSL -o regsync \
            "https://github.com/regclient/regclient/releases/download/${REGCLIENT_VERSION}/regsync-linux-${ARCH_GO}"
          chmod +x regsync; install_bin regsync regsync
        fi

        # Print what actually landed, so a version drift is visible in the log
        # rather than only in a scanner's changed verdict.
        for t in $TOOLS; do
          case "$t" in
            regctl|regsync)
              printf '%-14s %s\n' "$t" "$("$t" version 2>/dev/null | awk '/VCSTag/{print $2}')" ;;
            cosign)
              printf '%-14s %s\n' cosign "$(cosign version 2>/dev/null | awk '/GitVersion:/{print $2}')" ;;
            scout)
              printf '%-14s %s\n' docker-scout "$(docker-scout version 2>/dev/null | awk '/^version:/{print $2; exit}')" ;;
            opa)
              printf '%-14s %s\n' opa "$(opa version 2>/dev/null | awk '/^Version:/{print $2}')" ;;
          esac
        done
