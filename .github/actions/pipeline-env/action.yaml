name: Pipeline environment
description: >-
  Materialise the shared pipeline library at $RUNNER_TEMP/dhi-pipeline-lib.sh.
  THIS FILE IS THE SINGLE SOURCE OF TRUTH for the plumbing every stage shares:
  config loading, logging, registry auth, reference builders, the run manifest,
  the gate lifecycle, referrer classification, and the three multi-caller stage
  bodies (run_verify, check_current, promote_gate_check). Every stage action
  sources the generated file; the offline tests extract and source the same
  text (tests/extract-pipeline-lib.sh), so what is tested is what runs.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        cat >"$RUNNER_TEMP/dhi-pipeline-lib.sh" <<'DHI_PIPELINE_LIB_EOF'
        # shellcheck shell=bash
        #
        # dhi-pipeline-lib.sh -- shared plumbing for the DHI -> GAR mirroring pipeline.
        #
        # GENERATED from .github/actions/pipeline-env/action.yaml -- edit the YAML,
        # never a materialised copy of this file.
        #
        # THE CENTRAL INVARIANT: tag -> digest resolution happens exactly once, in
        # the resolve stage, and is written to the run manifest. Every later stage
        # reads the digest from the manifest and never re-resolves from the tag. If a
        # tag were re-resolved mid-run and had moved, the pipeline could verify one
        # image and promote a different one -- precisely the failure this design
        # forbids.

        set -euo pipefail

        # --------------------------------------------------------------------------
        # Paths
        # --------------------------------------------------------------------------
        # In CI the working directory is the checkout root; tests and other callers
        # outside CI set DHI_REPO_ROOT explicitly. The jq programs remain on disk as
        # data files -- they are shared verbatim between CI and the offline tests.
        REPO_ROOT="${DHI_REPO_ROOT:-$PWD}"
        CLASSIFY_JQ="$REPO_ROOT/scripts/lib/classify.jq"
        VEX_NORMALIZE_JQ="$REPO_ROOT/scripts/lib/vex-normalize.jq"
        ATTESTATION_TYPES="$REPO_ROOT/attestation-types.json"
        export REPO_ROOT CLASSIFY_JQ VEX_NORMALIZE_JQ ATTESTATION_TYPES

        # --------------------------------------------------------------------------
        # Logging
        # --------------------------------------------------------------------------
        # All logging goes to stderr so a stage can still emit machine-readable JSON on
        # stdout without the caller having to strip log lines out of it.
        _ts() { date -u +%Y-%m-%dT%H:%M:%SZ; }

        log()  { printf '%s  %s\n'       "$(_ts)" "$*" >&2; }
        warn() { printf '%s  WARN  %s\n' "$(_ts)" "$*" >&2; }
        err()  { printf '%s  ERROR %s\n' "$(_ts)" "$*" >&2; }
        die()  { err "$*"; exit 1; }
        step() { printf '\n%s  ===== %s =====\n' "$(_ts)" "$*" >&2; }

        # ok/bad render per-check gate results so the logs read as a checklist.
        ok()  { printf '%s  [PASS] %s\n' "$(_ts)" "$*" >&2; }
        bad() { printf '%s  [FAIL] %s\n' "$(_ts)" "$*" >&2; }

        # --------------------------------------------------------------------------
        # Config
        # --------------------------------------------------------------------------
        # Precedence: exported environment > config.env > built-in default.
        #
        # The environment has to win, because the documented interface is
        # `REPO=dhi-python TAG=3.13 <stage>` -- if sourcing config.env clobbered
        # that, per-run overrides would silently do nothing. `set -a; source` does
        # clobber, so any config key already non-empty in the environment is
        # captured first and re-applied afterwards.
        load_config() {
          local cfg="${CONFIG_ENV:-$REPO_ROOT/config.env}"

          if [[ -f "$cfg" ]]; then
            local saved key
            saved="$(mktemp)"
            while IFS= read -r key; do
              [[ -n "${!key:-}" ]] && printf '%s=%q\n' "$key" "${!key}" >>"$saved"
            done < <(sed -n 's/^\([A-Za-z_][A-Za-z0-9_]*\)=.*/\1/p' "$cfg")

            # Each `source` gets its own line: a shellcheck directive binds to the next
            # command, so folding these onto `set -a; source ...` would attach the
            # disable to `set -a` and leave the source unchecked-but-still-warned.
            set -a
            # shellcheck disable=SC1090  # path is config-driven by design
            source "$cfg"
            # shellcheck disable=SC1090  # generated temp file
            source "$saved"
            set +a
            rm -f "$saved"
            log "config: loaded $cfg (environment overrides preserved)"
          else
            log "config: no config.env found (using environment only)"
          fi

          : "${DOCKERHUB_ORG:=nicksdemoorg}"
          : "${SCOUT_REGISTRY:=registry.scout.docker.com}"
          : "${GAR_LOCATION:=us-central1}"
          : "${GAR_QUARANTINE_REPO:=dhi-quarantine}"
          : "${GAR_PROD_REPO:=dhi-prod}"
          : "${VERIFY_PLATFORM:=linux/amd64}"
          : "${SCAN_SEVERITY:=HIGH,CRITICAL}"

          # Trivy's default DB source is mirror.gcr.io, with ghcr.io only as a fallback.
          # Pinning ghcr.io keeps the scan gate to one registry host, which matters in any
          # environment with an egress allowlist -- a scan that cannot fetch its database
          # fails closed and looks like a tooling error, not a clean bill of health.
          : "${TRIVY_DB_REPOSITORY:=ghcr.io/aquasecurity/trivy-db:2}"
          export TRIVY_DB_REPOSITORY
          : "${REPO:=dhi-node}"
          : "${TAG:=24-alpine}"   # DHI publishes no "latest" tag
          : "${GITHUB_REPO:=dhi-gar-pipeline}"

          GAR_HOST="${GAR_LOCATION}-docker.pkg.dev"
          export DOCKERHUB_ORG SCOUT_REGISTRY GAR_LOCATION GAR_QUARANTINE_REPO \
                 GAR_PROD_REPO VERIFY_PLATFORM SCAN_SEVERITY REPO TAG GAR_HOST GITHUB_REPO
        }

        require_vars() {
          local missing=() v
          for v in "$@"; do
            if [[ -z "${!v:-}" || "${!v:-}" == REPLACE_ME* ]]; then missing+=("$v"); fi
          done
          (( ${#missing[@]} == 0 )) \
            || die "missing/unset config: ${missing[*]} -- set in config.env (see config.env.example) or export"
        }

        need_tool() {
          local t missing=()
          for t in "$@"; do command -v "$t" >/dev/null 2>&1 || missing+=("$t"); done
          (( ${#missing[@]} == 0 )) || die "required tool(s) not on PATH: ${missing[*]} -- run 'make tools' locally; CI installs via .github/actions/install-tools"
        }

        # --------------------------------------------------------------------------
        # Reference builders
        #
        # Everything downstream builds refs through these, so there is exactly one place
        # a registry path can be wrong.
        # --------------------------------------------------------------------------
        hub_repo() { printf '%s/%s' "$DOCKERHUB_ORG" "$REPO"; }
        hub_ref()  { printf 'docker.io/%s/%s:%s' "$DOCKERHUB_ORG" "$REPO" "$TAG"; }

        # The attestation registry. DHI stores attestations here under a repo path that
        # mirrors the Hub path; this is the --referrers-src / --external source.
        scout_ref() { printf '%s/%s/%s' "$SCOUT_REGISTRY" "$DOCKERHUB_ORG" "$REPO"; }

        gar_repo_path() { # $1 = quarantine|prod
          local gar_repo
          case "$1" in
            quarantine) gar_repo="$GAR_QUARANTINE_REPO" ;;
            prod)       gar_repo="$GAR_PROD_REPO" ;;
            *) die "gar_repo_path: expected 'quarantine' or 'prod', got '$1'" ;;
          esac
          require_vars GCP_PROJECT_ID
          printf '%s/%s/%s/%s' "$GAR_HOST" "$GCP_PROJECT_ID" "$gar_repo" "$REPO"
        }

        gar_ref()        { printf '%s:%s' "$(gar_repo_path "$1")" "$TAG"; }
        gar_digest_ref() { printf '%s@%s' "$(gar_repo_path "$1")" "$2"; }

        # --------------------------------------------------------------------------
        # Registry auth
        # --------------------------------------------------------------------------
        # TWO credential stores have to be populated, not one.
        #
        # `regctl registry login` writes to ~/.regctl/config.json. It does NOT write to
        # ~/.docker/config.json. Trivy and `docker scout` read Docker's store. So a
        # regctl-only login leaves those two unauthenticated, and the resulting failure
        # looks like a registry permissions problem rather than a missing credential --
        # verified by inspecting both files after a successful regctl login.
        #
        # `docker login` is therefore not redundant. Where the docker CLI is absent we
        # carry on: regctl is what the copy and referrer operations actually need, and
        # Trivy accepts credentials by environment variable as a fallback.
        _login_both() { # _login_both <host> <user> <secret>
          local host="$1" user="$2" secret="$3"

          printf '%s' "$secret" | regctl registry login "$host" -u "$user" --pass-stdin \
            || return 1

          if command -v docker >/dev/null 2>&1; then
            if ! printf '%s' "$secret" | docker login "$host" -u "$user" --password-stdin >/dev/null 2>&1; then
              warn "docker login failed for $host -- regctl is authenticated, but Trivy and"
              warn "docker scout read Docker's credential store and may not authenticate"
            fi
          else
            warn "docker CLI absent -- only regctl is authenticated for $host"
          fi
          return 0
        }

        # One Docker Hub PAT authenticates both docker.io and registry.scout.docker.com.
        #
        # The PAT is optional, because some environments inject Docker Hub credentials at
        # the network layer (a sandbox proxy, a credential helper, an existing docker
        # login). Observed in exactly such an environment: docker.io was authenticated
        # without any PAT, while registry.scout.docker.com was NOT -- and since that is
        # where every DHI attestation lives, the image side worked and the attestation
        # side returned "unauthorized".
        #
        # So a missing PAT is a warning, not a fatal error: the pipeline can still resolve
        # and copy the image, and the verify gate will fail loudly and specifically if the
        # attestations could not be read. Dying here would hide which half is broken.
        #
        # If DOCKERHUB_PAT_FILE points at a file, it is read from there -- keeping the
        # secret out of the process environment and out of shell history.
        login_dockerhub() {
          if [[ -z "${DOCKERHUB_PAT:-}" && -n "${DOCKERHUB_PAT_FILE:-}" && -r "${DOCKERHUB_PAT_FILE}" ]]; then
            DOCKERHUB_PAT="$(tr -d '\r\n' <"$DOCKERHUB_PAT_FILE")"
            log "auth: PAT read from $DOCKERHUB_PAT_FILE"
          fi

          if [[ -z "${DOCKERHUB_PAT:-}" ]]; then
            warn "DOCKERHUB_PAT is not set."
            warn "  If this environment injects Docker Hub credentials, docker.io will still work."
            warn "  $SCOUT_REGISTRY almost certainly will NOT -- and that is where the"
            warn "  attestations live, so expect the verify gate to report them unreadable."
            warn "  Provide a read-only PAT via DOCKERHUB_PAT or DOCKERHUB_PAT_FILE to fix that."
            return 0
          fi

          require_vars DOCKERHUB_USERNAME
          local host
          for host in docker.io "$SCOUT_REGISTRY"; do
            log "auth: login $host as $DOCKERHUB_USERNAME"
            _login_both "$host" "$DOCKERHUB_USERNAME" "$DOCKERHUB_PAT" \
              || die "login failed for $host -- for $SCOUT_REGISTRY confirm the PAT can read the org's Hardened Images"
          done

          # Trivy's fallback path, so a scan still authenticates if Docker's store is
          # unavailable (no docker CLI, or a credential helper we cannot write to).
          export TRIVY_USERNAME="$DOCKERHUB_USERNAME" TRIVY_PASSWORD="$DOCKERHUB_PAT"
        }

        # GAR takes a short-lived OAuth token as the password, with the fixed username
        # oauth2accesstoken. Two sources, in order:
        #   GAR_ACCESS_TOKEN -- exported by CI from google-github-actions/auth (WIF); no key file.
        #   gcloud           -- local developer credentials from `gcloud auth login`.
        login_gar() {
          require_vars GCP_PROJECT_ID
          local token
          if [[ -n "${GAR_ACCESS_TOKEN:-}" ]]; then
            token="$GAR_ACCESS_TOKEN"
            log "auth: GAR token from GAR_ACCESS_TOKEN (Workload Identity Federation)"
          else
            need_tool gcloud
            log "auth: GAR token from 'gcloud auth print-access-token'"
            token="$(gcloud auth print-access-token 2>/dev/null)" \
              || die "could not mint a GCP access token -- run 'gcloud auth login' or set GAR_ACCESS_TOKEN"
          fi
          [[ -n "$token" ]] || die "GCP access token was empty"

          # Both stores, for the same reason as login_dockerhub -- Trivy and docker scout
          # read Docker's store, regctl reads its own.
          _login_both "$GAR_HOST" oauth2accesstoken "$token" \
            || die "login failed for $GAR_HOST"

          # GAR access tokens are short-lived (~1h). Recorded so a stage that fails an
          # hour into a run has an obvious first thing to check.
          log "auth: GAR token is short-lived; re-run login_gar if a long run starts failing with 401"
        }

        # --------------------------------------------------------------------------
        # Run directory + run manifest
        # --------------------------------------------------------------------------
        tag_slug() { printf '%s' "$TAG" | tr -c 'A-Za-z0-9._-' '_'; }

        init_run_dir() {
          OUT_DIR="${OUT_DIR:-$REPO_ROOT/out}"
          RUN_DIR="${RUN_DIR:-$OUT_DIR/$REPO/$(tag_slug)}"
          RUN_MANIFEST="$RUN_DIR/run-manifest.json"
          mkdir -p "$RUN_DIR/attestations"
          export OUT_DIR RUN_DIR RUN_MANIFEST
        }

        # Read the manifest written by the resolve stage and export the digests. Later
        # stages call this instead of ever touching a tag.
        load_manifest() {
          init_run_dir
          [[ -f "$RUN_MANIFEST" ]] \
            || die "run manifest not found at $RUN_MANIFEST -- run the resolve stage (00) first"

          SOURCE_REF="$(jq -r '.source.ref' "$RUN_MANIFEST")"
          INDEX_DIGEST="$(jq -r '.source.indexDigest' "$RUN_MANIFEST")"
          PLATFORM_DIGEST="$(jq -r '.source.platformDigest // empty' "$RUN_MANIFEST")"
          RESOLVED_PLATFORM="$(jq -r '.source.platform // empty' "$RUN_MANIFEST")"
          SCOUT_SRC="$(jq -r '.attestationSource.ref' "$RUN_MANIFEST")"
          export SOURCE_REF INDEX_DIGEST PLATFORM_DIGEST RESOLVED_PLATFORM SCOUT_SRC

          [[ "$INDEX_DIGEST" == sha256:* ]] || die "run manifest has no valid source.indexDigest"
          log "manifest: $RUN_MANIFEST"
          log "manifest: source          $SOURCE_REF"
          log "manifest: index digest    $INDEX_DIGEST"
          log "manifest: platform digest ${PLATFORM_DIGEST:-<none>} (${RESOLVED_PLATFORM:-n/a})"
        }

        # Atomically apply a jq filter to the run manifest.
        # Usage: manifest_set '.gates.verify = $v' --argjson v "$json"
        manifest_set() {
          local filter="$1"; shift
          local tmp; tmp="$(mktemp)"
          jq "$@" "$filter" "$RUN_MANIFEST" >"$tmp" && mv "$tmp" "$RUN_MANIFEST"
        }

        # --------------------------------------------------------------------------
        # Gate lifecycle
        # --------------------------------------------------------------------------
        # A gate must never be able to leave a STALE PASS behind.
        #
        # This is not hypothetical -- it happened. A scan stage died on a tooling error
        # before writing its result, the previous run's "pass" was still in the manifest,
        # and the promote stage read that pass and promoted an image carrying a CRITICAL
        # CVE. Exit code 0. A crashing gate was indistinguishable from a passing one,
        # which is the single worst failure mode a promotion gate can have.
        #
        # So: gate_begin overwrites the gate with status "running" the moment the stage
        # starts, and an EXIT trap converts a still-"running" gate into "error". Any
        # abnormal termination -- die, an unhandled error under set -e, SIGTERM in CI --
        # therefore lands on a non-passing status. Promotion additionally requires the
        # recorded digest to match the digest being promoted.
        gate_begin() {
          GATE_NAME="$1"
          export GATE_NAME
          # shellcheck disable=SC2016  # jq program: $vars are jq bindings from --arg
          manifest_set '
            .gates[$g]  = { status: "running", digest: $d, startedAt: $at }
            | .stages[$g] = { status: "running", at: $at }
          ' --arg g "$GATE_NAME" --arg d "$INDEX_DIGEST" --arg at "$(_ts)"
          trap '_gate_trap' EXIT
        }

        _gate_trap() {
          local rc=$?
          local current
          current="$(jq -r --arg g "${GATE_NAME:-}" '.gates[$g].status // "missing"' "$RUN_MANIFEST" 2>/dev/null || echo missing)"
          if [[ "$current" == "running" ]]; then
            err "gate '$GATE_NAME' terminated without recording a result (exit $rc) -- recording as ERROR"
            err "this is deliberately NOT left as a pass: a gate that crashed has not approved anything"
            # shellcheck disable=SC2016  # jq program: $vars are jq bindings from --arg
            manifest_set '
              .gates[$g]  = { status: "error", digest: $d, at: $at, exitCode: ($rc | tonumber) }
              | .stages[$g] = { status: "error", at: $at }
            ' --arg g "$GATE_NAME" --arg d "$INDEX_DIGEST" --arg at "$(_ts)" --arg rc "$rc" 2>/dev/null || true
          fi
          exit "$rc"
        }

        # Terminal gate result. Records the digest the verdict applies to so a later stage
        # cannot apply it to different content.
        gate_end() { # gate_end <gate> <pass|fail> <json-detail>
          # shellcheck disable=SC2016  # jq program: $vars are jq bindings from --arg
          manifest_set '
            .gates[$g]  = ($v + { status: $st, digest: $d, at: $at })
            | .stages[$g] = { status: $st, at: $at }
          ' --arg g "$1" --arg st "$2" --argjson v "$3" --arg d "$INDEX_DIGEST" --arg at "$(_ts)"
        }

        # --------------------------------------------------------------------------
        # Digest resolution
        # --------------------------------------------------------------------------
        # `manifest head` is a HEAD request: it returns the digest without transferring
        # the manifest body. --require-digest falls back to a GET when the registry
        # omits the Docker-Content-Digest header.
        resolve_index_digest() {
          local ref="$1"
          regctl manifest head "$ref" --require-digest \
            || die "could not resolve digest for $ref -- check the tag exists and that you are logged in"
        }

        # Returns empty (not an error) for single-platform images, which is a valid shape
        # the gates must tolerate rather than crash on.
        resolve_platform_digest() {
          local ref="$1" platform="$2"
          regctl manifest head "$ref" --platform "$platform" --require-digest 2>/dev/null || true
        }

        # --------------------------------------------------------------------------
        # Referrers + classification
        # --------------------------------------------------------------------------
        # Fetch the raw referrers index for a subject. $2 (optional) is an external
        # referrers source -- required for Hub subjects, whose attestations live in
        # registry.scout.docker.com rather than alongside the image.
        #
        # An empty referrers set is a legitimate answer (it means "no attestations"),
        # and distinguishing it from a transport failure is the verify gate's job, so a
        # non-zero regctl exit is surfaced rather than swallowed.
        fetch_referrers() {
          local subject="$1" external="${2:-}"
          local -a args=("$subject" --format body)
          [[ -n "$external" ]] && args+=(--external "$external")
          regctl artifact list "${args[@]}"
        }

        # Referrers index (file) -> classified inventory. See scripts/lib/classify.jq.
        # $2 (optional) is a {digest: predicateType} map from deep resolution.
        classify_referrers() {
          local referrers_json="$1" deep="${2:-}"
          [[ -n "$deep" ]] || deep='{}'
          local require_vex=false
          [[ "${REQUIRE_VEX:-0}" == "1" ]] && require_vex=true
          jq -f "$CLASSIFY_JQ" \
             --argjson types "$(cat "$ATTESTATION_TYPES")" \
             --argjson deep "$deep" \
             --argjson requireVex "$require_vex" \
             "$referrers_json"
        }

        # Determine a referrer's predicate type by looking INSIDE it.
        #
        # Necessary because a referrer may advertise nothing useful on its descriptor:
        # artifactType application/vnd.in-toto+json with no annotations is a complete and
        # valid way to attach SLSA provenance, and it is indistinguishable from an SBOM
        # without opening it. Two payload shapes are handled:
        #
        #   1. in-toto Statement    -- .predicateType at the top level of the blob.
        #   2. Docker/BuildKit      -- the referrer is a manifest whose LAYER annotations
        #      attestation manifest    carry in-toto.io/predicate-type.
        #
        # Prints the predicate type, or nothing if it cannot be determined. Never fails
        # the caller: an unresolvable referrer is a finding for the gate to report, not an
        # error to crash on.
        resolve_predicate_type() {
          local repo="$1" digest="$2" payload pt

          # Shape 1: the blob is the in-toto Statement itself.
          payload="$(regctl artifact get "$repo@$digest" 2>/dev/null || true)"
          if [[ -n "$payload" ]]; then
            pt="$(jq -r 'if type == "object" then (.predicateType // empty) else empty end' <<<"$payload" 2>/dev/null || true)"
            if [[ -n "$pt" ]]; then printf '%s' "$pt"; return 0; fi
          fi

          # Shape 2: predicate type is on the referrer manifest's layer annotations.
          pt="$(regctl manifest get "$repo@$digest" --format body 2>/dev/null \
                | jq -r '[ (.layers // [])[]
                           | (.annotations // {})["in-toto.io/predicate-type"] // empty ] | .[0] // empty' \
                2>/dev/null || true)"
          [[ -n "$pt" ]] && printf '%s' "$pt"
          return 0
        }

        # classify_referrers, then re-run it having opened anything whose type could not
        # be read from its descriptor.
        #
        #   $1  referrers index file
        #   $2  repo reference (no tag/digest) holding the referrer BLOBS -- the Scout
        #       repo when referrers were queried with --external, the image's own repo
        #       when they are native.
        classify_referrers_deep() {
          local referrers_json="$1" blob_repo="$2"
          local shallow deep_map digest pt

          shallow="$(classify_referrers "$referrers_json")"
          deep_map='{}'

          while read -r digest; do
            [[ -n "$digest" ]] || continue
            pt="$(resolve_predicate_type "$blob_repo" "$digest")"
            if [[ -n "$pt" ]]; then
              deep_map="$(jq -c --arg d "$digest" --arg p "$pt" '. + {($d): $p}' <<<"$deep_map")"
              log "deep-resolved ${digest:0:19}... -> $pt"
            else
              warn "could not determine a predicate type for ${digest:0:19}... (opened it; found none)"
            fi
          done < <(jq -r '.artifacts[]
                          | select(.class == "attestation-manifest-generic" or .class == "unclassified")
                          | .digest' <<<"$shallow")

          if [[ "$deep_map" == '{}' ]]; then
            printf '%s' "$shallow"
          else
            classify_referrers "$referrers_json" "$deep_map"
          fi
        }

        # --------------------------------------------------------------------------
        # GitHub Actions step summary
        # --------------------------------------------------------------------------
        # No-ops outside CI so stage bodies can call it unconditionally.
        summary() {
          [[ -n "${GITHUB_STEP_SUMMARY:-}" ]] || return 0
          printf '%s\n' "$*" >>"$GITHUB_STEP_SUMMARY"
        }

        # ==========================================================================
        # Stage bodies with more than one caller.
        #
        # run_verify is called by the verify action AND re-run against prod by the
        # promote action. check_current is the scheduled poll's pre-check, called by
        # the plan-matrix action. promote_gate_check is the promotion refusal logic,
        # kept as a function so tests/test-gate-safety.sh can assert every refusal
        # case offline.
        # ==========================================================================

        # GATE 1: did the attestations survive the copy, and is it still the same
        # image? Everything it checks is something that fails SILENTLY otherwise:
        #
        #   - A referrers query against the wrong subject returns an empty set with a
        #     zero exit code. "No attestations" and "I asked the wrong question" are
        #     identical from the caller's side.
        #   - A digest that changed in transit means every attestation is bound to
        #     content that is no longer what you are about to promote.
        #   - A referrer whose type cannot be read from its descriptor will be
        #     reported as a missing attestation unless its payload is opened.
        #
        # Env: VERIFY_TARGET=quarantine|prod (default quarantine; promote re-runs
        # against prod), REQUIRE_VEX=1 to make OpenVEX a hard requirement, SKIP_LOGIN=1
        # to reuse existing credentials. Exits non-zero if any required check fails,
        # which blocks promotion. Writes verify-report*.json either way -- a failed
        # gate must still produce evidence.
        run_verify() {
          need_tool regctl jq
          require_vars REPO TAG GCP_PROJECT_ID
          load_manifest

          TARGET="${VERIFY_TARGET:-quarantine}"
          QREPO="$(gar_repo_path "$TARGET")"
          QTAG_REF="$(gar_ref "$TARGET")"
          REPORT="$RUN_DIR/verify-report${TARGET:+-$TARGET}.json"
          [[ "$TARGET" == "quarantine" ]] && REPORT="$RUN_DIR/verify-report.json"

          step "20 verify: $QTAG_REF"
          log "expected digest (from stage 00): $INDEX_DIGEST"

          # Invalidate any previous verdict before doing anything that can fail. Only the
          # quarantine pass owns the "verify" gate -- the prod re-check (VERIFY_TARGET=prod,
          # invoked by the promote stage) must not clobber it.
          [[ "$TARGET" == "quarantine" ]] && gate_begin verify

          if [[ "${SKIP_LOGIN:-0}" != "1" ]]; then
            login_gar
          else
            log "auth: SKIP_LOGIN=1, reusing existing credentials"
          fi

          CHECKS='[]'
          add_check() { # add_check <id> <status pass|fail|warn> <description> <detail>
            CHECKS="$(jq -c --arg id "$1" --arg st "$2" --arg d "$3" --arg det "$4" \
                      '. + [{id: $id, status: $st, description: $d, detail: $det}]' <<<"$CHECKS")"
            case "$2" in
              pass) ok   "$3" ;;
              warn) warn "$3 -- $4" ;;
              *)    bad  "$3 -- $4" ;;
            esac
          }

          # -------------------------------------------------------------------------
          # Check 1 -- the image was not mutated.
          #
          # Compares what is live at the target RIGHT NOW against the digest stage 00
          # resolved. Re-reading live rather than trusting what the sync stage recorded
          # is the point: it catches anything that changed the target after the sync.
          # -------------------------------------------------------------------------
          step "check 1: digest integrity"
          LIVE_DIGEST="$(regctl manifest head "$QTAG_REF" --require-digest 2>/dev/null || true)"
          if [[ -z "$LIVE_DIGEST" ]]; then
            add_check digest-integrity fail "image is present at $TARGET" \
              "could not resolve a digest for $QTAG_REF -- is it there?"
          elif [[ "$LIVE_DIGEST" == "$INDEX_DIGEST" ]]; then
            add_check digest-integrity pass "digest matches source ($INDEX_DIGEST)" ""
          else
            add_check digest-integrity fail "digest MISMATCH" \
              "source=$INDEX_DIGEST target=$LIVE_DIGEST -- attestations bound to the source digest do not describe this image"
          fi

          # -------------------------------------------------------------------------
          # Check 2 -- required attestations are present.
          #
          # Referrers are collected from BOTH the index digest and the platform digest
          # and then merged. DHI may attach attestations to either, and asking only one
          # of them is the difference between a passing gate and a confusing empty result.
          # -------------------------------------------------------------------------
          step "check 2: attestation presence"

          REFERRERS="$RUN_DIR/referrers-${TARGET}.json"
          MERGED='{"manifests":[]}'
          SUBJECTS_TRIED='[]'

          for d in "$INDEX_DIGEST" "${PLATFORM_DIGEST:-}"; do
            [[ -n "$d" ]] || continue
            subject="$QREPO@$d"
            raw="$RUN_DIR/referrers-${TARGET}-${d#sha256:}.json"
            if fetch_referrers "$subject" "" >"$raw" 2>"$raw.err"; then
              n="$(jq -r '(.manifests // []) | length' "$raw" 2>/dev/null || echo 0)"
              log "subject ${d:0:19}... -> $n referrer(s)"
              SUBJECTS_TRIED="$(jq -c --arg s "$d" --argjson n "$n" '. + [{digest: $s, referrers: $n}]' <<<"$SUBJECTS_TRIED")"
              MERGED="$(jq -c --slurpfile add "$raw" \
                '.manifests = ((.manifests + ($add[0].manifests // [])) | unique_by(.digest))' <<<"$MERGED")"
            else
              warn "referrers query failed for ${d:0:19}...:"
              sed 's/^/    /' "$raw.err" >&2
              SUBJECTS_TRIED="$(jq -c --arg s "$d" '. + [{digest: $s, referrers: null, error: true}]' <<<"$SUBJECTS_TRIED")"
            fi
          done

          printf '%s' "$MERGED" | jq . >"$REFERRERS"
          TOTAL="$(jq -r '(.manifests // []) | length' "$REFERRERS")"
          log "merged unique referrers: $TOTAL"

          # Deep classification: open anything whose type is not readable from its
          # descriptor. The blobs live in the target repo because the sync stage copied
          # them there as native referrers.
          INVENTORY="$RUN_DIR/inventory-${TARGET}.json"
          classify_referrers_deep "$REFERRERS" "$QREPO" >"$INVENTORY"

          jq -r '.artifacts[] | "    " + (.class + (" " * (34 - (.class | length))))
                 + (.artifactType // .predicateType // "?")
                 + (if .deepResolved then "   [resolved from payload]" else "" end)' "$INVENTORY" >&2

          MISSING="$(jq -c '.groupsMissing' "$INVENTORY")"
          PRESENT="$(jq -c '.groupsPresent' "$INVENTORY")"
          EXPECTED_MISSING="$(jq -c '.groupsExpectedMissing' "$INVENTORY")"
          REQUIRED="$(jq -c '.groupsRequired' "$INVENTORY")"

          if [[ "$TOTAL" == "0" ]]; then
            add_check attestations-present fail "required attestations present" \
              "ZERO referrers found at $TARGET. Either the copy dropped them (check the sync stage's --referrers-src) or the source never had any. Diagnose: gh workflow run inspect-referrers.yaml -f repo=$REPO -f tag=$TAG"
          elif [[ "$MISSING" == "[]" ]]; then
            add_check attestations-present pass "required attestations present: $PRESENT (required: $REQUIRED)" ""
          else
            add_check attestations-present fail "required attestations MISSING: $MISSING" \
              "found groups $PRESENT across $TOTAL referrer(s); required: $REQUIRED"
          fi

          # Expected-but-absent groups warn instead of failing. OpenVEX ships on
          # debian-based DHI tags and not on alpine ones -- a property of the upstream
          # image, not of this copy, so failing here would block an image for something the
          # pipeline neither caused nor can fix. REQUIRE_VEX=1 makes it a hard requirement.
          # Which groups are advisory *after* policy is applied: an expected group that
          # REQUIRE_VEX promoted to required is no longer advisory.
          EXPECTED_CONFIGURED="$(jq -c --argjson req "$REQUIRED" '(.expectedGroups // []) - $req' "$ATTESTATION_TYPES")"

          if [[ "$EXPECTED_MISSING" != "[]" ]]; then
            add_check expected-attestations warn "expected but absent: $EXPECTED_MISSING" \
              "not present on this tag. If policy requires it, re-run with REQUIRE_VEX=1 to fail instead of warn. Note the scan gate will run unsuppressed without VEX."
          elif [[ "$EXPECTED_CONFIGURED" == "[]" ]]; then
            # Everything that would merely be "expected" has been promoted to required by
            # policy, so there is nothing left for this check to soften. Saying "all present"
            # here would read as a contradiction next to a required-group failure.
            add_check expected-attestations pass "no advisory groups apply (all are required by policy)" ""
          else
            add_check expected-attestations pass "all expected attestation groups present: $EXPECTED_CONFIGURED" ""
          fi

          # Unclassified referrers do not fail the gate -- an unrecognised extra attestation
          # is not a security problem -- but they are reported, because an unclassified
          # referrer is usually a matcher this repo has not learned yet.
          UNCLASS="$(jq -r '.unclassified' "$INVENTORY")"
          if [[ "$UNCLASS" != "0" ]]; then
            add_check no-unclassified warn "$UNCLASS referrer(s) could not be classified" \
              "$(jq -c '[.artifacts[] | select(.class == "unclassified") | {artifactType, predicateType}]' "$INVENTORY") -- add matchers to attestation-types.json"
          else
            add_check no-unclassified pass "every referrer was classified" ""
          fi

          # -------------------------------------------------------------------------
          # Check 3 -- Docker Scout cross-check. INFORMATIONAL ONLY.
          #
          # Deliberately never fails the gate. Scout reading the attestations is a nice
          # confirmation, but Scout not reading them out of GAR is a tooling/auth gap, not
          # evidence about the image. regctl is the authority here; letting a second tool's
          # auth quirks block a promotion would be the wrong dependency.
          # -------------------------------------------------------------------------
          step "check 3: docker scout cross-check (informational)"
          SCOUT_OUT="$RUN_DIR/scout-attest-list-${TARGET}.txt"
          if docker scout version >/dev/null 2>&1; then
            if docker scout attest list --platform "$VERIFY_PLATFORM" \
                 "registry://$QREPO@$LIVE_DIGEST" >"$SCOUT_OUT" 2>&1; then
              n_scout="$(grep -cE '^\s*(SBOM|Provenance|VEX|in-toto|https://)' "$SCOUT_OUT" 2>/dev/null || true)"
              add_check scout-crosscheck pass "docker scout read attestations from $TARGET (${n_scout:-0} line(s) matched)" ""
            else
              add_check scout-crosscheck warn "docker scout could not read attestations where regctl could" \
                "$(head -3 "$SCOUT_OUT" | tr '\n' ' ') -- tooling gap, not a gate failure"
            fi
          else
            add_check scout-crosscheck warn "docker scout not installed" "skipped"
          fi

          # -------------------------------------------------------------------------
          # Report
          # -------------------------------------------------------------------------
          FAILED="$(jq -r '[.[] | select(.status == "fail")] | length' <<<"$CHECKS")"
          WARNED="$(jq -r '[.[] | select(.status == "warn")] | length' <<<"$CHECKS")"
          GATE_STATUS="pass"; [[ "$FAILED" == "0" ]] || GATE_STATUS="fail"

          jq -n \
            --arg gate "verify" \
            --arg status "$GATE_STATUS" \
            --arg at "$(_ts)" \
            --arg target "$TARGET" \
            --arg ref "$QTAG_REF" \
            --arg expectedDigest "$INDEX_DIGEST" \
            --arg liveDigest "$LIVE_DIGEST" \
            --arg platform "$VERIFY_PLATFORM" \
            --argjson subjectsQueried "$SUBJECTS_TRIED" \
            --argjson checks "$CHECKS" \
            --slurpfile inventory "$INVENTORY" \
            '{
               gate: $gate, status: $status, at: $at,
               target: { name: $target, ref: $ref, platform: $platform },
               digest: { expected: $expectedDigest, live: $liveDigest,
                         matches: ($expectedDigest == $liveDigest) },
               subjectsQueried: $subjectsQueried,
               attestations: $inventory[0],
               checks: $checks,
               summary: {
                 failed: ($checks | map(select(.status == "fail")) | length),
                 warned: ($checks | map(select(.status == "warn")) | length),
                 passed: ($checks | map(select(.status == "pass")) | length)
               }
             }' >"$REPORT"

          log "wrote ${REPORT#"$REPO_ROOT"/}"

          if [[ "$TARGET" == "quarantine" ]]; then
            gate_end verify "$GATE_STATUS" \
              "$(jq -c '{summary, groupsPresent: .attestations.groupsPresent, groupsMissing: .attestations.groupsMissing}' "$REPORT")"
          fi

          # GitHub step summary -- a failed gate must say which check failed and why,
          # without anyone opening the raw logs.
          if [[ "$GATE_STATUS" == "pass" ]]; then
            summary "### ✅ Verify gate passed"
          else
            summary "### ❌ Verify gate FAILED — promotion blocked"
          fi
          summary ""
          summary "\`$QTAG_REF\` @ \`$LIVE_DIGEST\`"
          summary ""
          summary "| Check | Result | Detail |"
          summary "|---|---|---|"
          while read -r line; do summary "$line"; done < <(
            jq -r '.checks[] | "| " + .description + " | "
                   + (if .status == "pass" then "✅ pass" elif .status == "warn" then "⚠️ warn" else "❌ **fail**" end)
                   + " | " + (if .detail == "" then "—" else (.detail | gsub("\\|"; "\\\\|") | .[0:300]) end) + " |"' "$REPORT"
          )
          summary ""
          summary "**Attestations found (${TOTAL}):**"
          summary ""
          while read -r line; do summary "$line"; done < <(
            jq -r '.attestations.artifacts[] | "- `" + .class + "` — " + (.artifactType // .predicateType // "?")
                   + (if .deepResolved then " _(resolved from payload)_" else "" end)' "$REPORT"
          )

          if [[ "$GATE_STATUS" != "pass" ]]; then
            step "20 verify: FAILED ($FAILED check(s))"
            die "verify gate failed -- image stays in $TARGET, nothing promoted"
          fi

          step "20 verify: PASS${WARNED:+ ($WARNED warning(s))}"
        }

        # Which sync-config.json entries actually need a pipeline run?
        #
        # The scheduled trigger polls; running the full pipeline every tick would burn
        # ~10 minutes of runner time per tag for work that almost always concludes
        # "nothing changed". This check is the short-circuit: two HEAD requests per tag
        # (upstream digest, prod digest), a comparison, and a filtered list out. A
        # quiet tick costs seconds, not minutes.
        #
        # A tag needs a sync when:
        #   not-in-prod     the tag has never been promoted
        #   upstream-moved  the upstream digest differs from what prod holds
        #
        # Prints a JSON array of stale entries on STDOUT (logs go to stderr). Returns:
        #   0  check completed; stdout is authoritative
        #   3  check completed BUT one or more upstream digests could not be resolved.
        #      Stdout still carries whatever was determined. Deliberately non-zero: if
        #      the Hub credential dies, every entry becomes unresolvable and a silent
        #      success would read as "everything is current" forever -- a dead poll that
        #      looks healthy is the worst failure mode a scheduled trigger can have.
        check_current() {
          need_tool regctl jq
          require_vars GCP_PROJECT_ID

          CONFIG="${SYNC_CONFIG:-$REPO_ROOT/sync-config.json}"
          [[ -f "$CONFIG" ]] || die "no sync config at $CONFIG"

          if [[ "${SKIP_LOGIN:-0}" != "1" ]]; then
            login_dockerhub
            login_gar
          else
            log "auth: SKIP_LOGIN=1, reusing existing credentials"
          fi

          TOTAL="$(jq -r '.tags | length' "$CONFIG")"
          step "checking $TOTAL configured tag(s) against prod"

          RESULTS='[]'
          ERRORS=0

          while IFS=$'\t' read -r repo tag require_vex; do
            [[ -n "$repo" ]] || continue
            # The ref builders read these globals.
            REPO="$repo"
            TAG="$tag"

            src="$(regctl manifest head "$(hub_ref)" --require-digest 2>/dev/null || true)"
            if [[ -z "$src" ]]; then
              warn "$repo:$tag  could not resolve the UPSTREAM digest -- excluded from this run."
              warn "  transient network failure, a removed tag, or a dead Hub credential."
              ERRORS=$((ERRORS + 1))
              continue
            fi

            prod="$(regctl manifest head "$(gar_ref prod)" --require-digest 2>/dev/null || true)"
            if [[ -z "$prod" ]]; then
              reason="not-in-prod"
            elif [[ "$prod" != "$src" ]]; then
              reason="upstream-moved"
            else
              log "$repo:$tag  current ($src)"
              continue
            fi

            log "$repo:$tag  NEEDS SYNC  reason=$reason upstream=$src prod=${prod:-none}"
            RESULTS="$(jq -c \
              --arg r "$repo" --arg t "$tag" --argjson rv "$require_vex" \
              --arg reason "$reason" --arg src "$src" --arg prod "${prod:-}" \
              '. + [{repo: $r, tag: $t, requireVex: $rv, reason: $reason,
                     srcDigest: $src, prodDigest: (if $prod == "" then null else $prod end)}]' \
              <<<"$RESULTS")"
          done < <(jq -r '.tags[] | [.repo, .tag, (.requireVex // false)] | @tsv' "$CONFIG")

          STALE="$(jq -r 'length' <<<"$RESULTS")"
          SUFFIX=""
          (( ERRORS > 0 )) && SUFFIX=" ($ERRORS unresolvable -- returning non-zero so this is investigated)"
          step "result: $STALE of $TOTAL tag(s) need a sync$SUFFIX"

          printf '%s\n' "$RESULTS"
          (( ERRORS == 0 )) || return 3
        }

        # The promotion refusal logic. Reads the run manifest rather than trusting
        # that the caller ran the stages in order: a re-run of a single CI step or a
        # hand-typed invocation must be unable to promote an image whose gates did not
        # pass -- otherwise "quarantine" is a naming convention rather than a boundary.
        #
        # Requires load_manifest to have run (RUN_MANIFEST, INDEX_DIGEST set). Sets
        # GATES_OK=0/1; dies on refusal unless FORCE_PROMOTE=1 AND ALLOW_UNSAFE=1, in
        # which case the bypass is stamped on the record via GATES_OK=0.
        promote_gate_check() {
          VERIFY_STATUS="$(jq -r '.gates.verify.status // "not-run"' "$RUN_MANIFEST")"
          SCAN_STATUS="$(jq -r '.gates.scan.status // "not-run"' "$RUN_MANIFEST")"
          VERIFY_DIGEST="$(jq -r '.gates.verify.digest // ""' "$RUN_MANIFEST")"
          SCAN_DIGEST="$(jq -r '.gates.scan.digest // ""' "$RUN_MANIFEST")"
          log "verify gate: $VERIFY_STATUS (digest ${VERIFY_DIGEST:-<none recorded>})"
          log "scan gate  : $SCAN_STATUS (digest ${SCAN_DIGEST:-<none recorded>})"

          # A "pass" is only usable if it was recorded FOR THIS DIGEST.
          #
          # Status alone is not sufficient. A gate verdict is a statement about specific
          # content, and a manifest can outlive the content it described -- a re-sync that
          # picked up a moved upstream tag, or a hand-edited manifest, would otherwise let a
          # stale approval authorise different bytes. Both conditions are required, and an
          # absent digest is treated as unusable rather than assumed to match.
          GATES_OK=0
          if [[ "$VERIFY_STATUS" == "pass" && "$SCAN_STATUS" == "pass" ]]; then
            if [[ "$VERIFY_DIGEST" == "$INDEX_DIGEST" && "$SCAN_DIGEST" == "$INDEX_DIGEST" ]]; then
              GATES_OK=1
            else
              bad "gate verdicts do not belong to the digest being promoted"
              err "  promoting     : $INDEX_DIGEST"
              err "  verify applied: ${VERIFY_DIGEST:-<none>}"
              err "  scan applied  : ${SCAN_DIGEST:-<none>}"
              err "re-run the gates against this digest"
            fi
          fi

          if (( ! GATES_OK )); then
            if [[ "${FORCE_PROMOTE:-0}" == "1" && "${ALLOW_UNSAFE:-0}" == "1" ]]; then
              warn "FORCE_PROMOTE with ALLOW_UNSAFE: promoting despite verify=$VERIFY_STATUS scan=$SCAN_STATUS"
              warn "this is recorded in the run manifest and the evidence bundle"
            else
              bad "gates did not pass -- refusing to promote"
              summary "### ❌ Promotion blocked"
              summary ""
              summary "| Gate | Status |"
              summary "|---|---|"
              summary "| Verify | $VERIFY_STATUS |"
              summary "| Scan | $SCAN_STATUS |"
              summary ""
              summary "\`$INDEX_DIGEST\` stays in **quarantine** and was not promoted."
              die "verify=$VERIFY_STATUS scan=$SCAN_STATUS -- image stays in quarantine (override: FORCE_PROMOTE=1 ALLOW_UNSAFE=1)"
            fi
          else
            ok "both gates passed"
          fi
        }

        # --------------------------------------------------------------------------
        # Bootstrap
        # --------------------------------------------------------------------------
        load_config
        DHI_PIPELINE_LIB_EOF
        echo "pipeline library written to $RUNNER_TEMP/dhi-pipeline-lib.sh ($(wc -l <"$RUNNER_TEMP/dhi-pipeline-lib.sh") lines)"
