name: 30 Scan gate
description: >-
  GATE 2. Two refusals in one stage, both from docker-scout: a vulnerability
  scan with the vendor's VEX applied, and a Rego policy evaluation
  (policy/*.rego) asserting the image really is a Docker Hardened Image.

  THE VEX PART IS STILL THE WHOLE POINT of the scan half. A hardened image
  routinely reports HIGH and CRITICAL CVEs that are not exploitable in that
  image; DHI ships signed VEX statements saying exactly that. Scanning without
  them produces a wall of red a team learns to ignore, which is worse than not
  scanning. What CHANGED with docker-scout is that no VEX plumbing is needed:
  Scout reads the VEX attestation off the registry itself and its SBOM carries
  both the Debian SOURCE and BINARY package identifiers linked by an explicit
  `parent` edge, so the source-to-binary remapping this repo used to perform for
  Trivy (scripts/lib/vex-normalize.jq, now deleted) is unnecessary.

  THE GATE VERDICT COMES FROM THE EXIT CODE, not from parsing a report -- the
  opposite of the Trivy implementation, for a documented reason: `docker scout
  cves` has NO --format json. Its structured formats are SARIF/GitLab/SPDX,
  whose population Docker does not document, so a report-derived verdict would
  rest on a schema that could change silently. Exit codes are specified (0 clean,
  2 findings) and are checked with a strict ALLOWLIST -- see the comment on
  run_scout_gate for why "fail only on 2" is a fail-open bug.
inputs:
  repo:
    description: Repository under the Hub org (e.g. dhi-node)
    required: true
  tag:
    description: Tag being scanned
    required: true
  skip-vex:
    description: >-
      'true' is the NEGATIVE TEST -- scan the identical image with the vendor's
      VEX rejected, so the same digest that passes normally now fails and
      promotion is blocked. That contrast is the demo.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: ./.github/actions/pipeline-env
    - shell: bash
      env:
        REPO: ${{ inputs.repo }}
        TAG: ${{ inputs.tag }}
        SKIP_VEX: ${{ inputs.skip-vex == 'true' && '1' || '0' }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC1091
        source "$RUNNER_TEMP/dhi-pipeline-lib.sh"

        SKIP_VEX="${SKIP_VEX:-0}"

        need_tool regctl docker-scout jq
        require_vars REPO TAG GCP_PROJECT_ID
        load_manifest

        QREPO="$(gar_repo_path quarantine)"
        # registry:// is REQUIRED, not cosmetic. Without it Scout prefers a
        # locally-present image, and Docker's own documentation warns that a
        # local hit means Scout finds no attestation there -- silently losing
        # the VEX and reporting false positives. In a digest-pinned pipeline
        # whose claim is "the thing we scanned is the thing we promoted",
        # scanning local content would break that claim without any error.
        SCAN_REF="registry://$QREPO@$INDEX_DIGEST"
        REPORT="$RUN_DIR/scan-report.json"

        # Scout takes lowercase severities; SCAN_SEVERITY is the repo-wide
        # uppercase knob. Derived rather than hardcoded so a stricter
        # SCAN_SEVERITY actually changes what the gate refuses -- hardcoding
        # here while passing the config through would make MEDIUM look applied
        # while never blocking anything.
        SCOUT_SEVERITY="$(printf '%s' "$SCAN_SEVERITY" | tr '[:upper:]' '[:lower:]')"

        step "30 scan: $SCAN_REF"
        log "digest (pinned by stage 00): $INDEX_DIGEST"
        log "platform: $VERIFY_PLATFORM"
        log "gating severities: $SCOUT_SEVERITY"
        (( SKIP_VEX )) && warn "skip-vex: the vendor's VEX will be REJECTED (negative test)"

        # Invalidate any previous verdict before doing anything that can fail.
        gate_begin scan

        if [[ "${SKIP_LOGIN:-0}" != "1" ]]; then
          login_gar
        else
          log "auth: SKIP_LOGIN=1, reusing existing credentials"
        fi

        # -------------------------------------------------------------------
        # Rejecting VEX, for the baseline pass and the negative test.
        #
        # --vex-author is an allowlist of accepted VEX authors, as regexes,
        # defaulting to [<.*@docker.com>]. Real DHI VEX is authored
        # "Docker Hardened Images <dhi@docker.com>", which matches that default;
        # pointing the allowlist at an address nothing can match is therefore
        # how you ask Scout to trust no VEX at all. Scout has no --no-vex flag,
        # so this is the only lever available.
        #
        # This mechanism is INFERRED from the flag's semantics, not stated in
        # Docker's docs. It is self-checking: the baseline pass below must
        # report at least as many findings as the gate pass, and if a VEX
        # attestation exists while the two counts are identical, the run says so
        # loudly rather than reporting a reassuring "0 suppressed". A negative
        # test that silently stopped being negative is exactly the failure this
        # repo refuses to ship.
        # -------------------------------------------------------------------
        VEX_REJECT_ARGS=(--vex-author '<vex-disabled@invalid.test>')

        # -------------------------------------------------------------------
        # The exit-code allowlist.
        #
        # Docker documents exactly one code: "Return exit code '2' if
        # vulnerabilities are detected". Everything else is unspecified, and
        # scout-cli#213 records a run that DETECTED VULNERABILITIES and exited
        # 255. So the naive gate -- fail on 2, otherwise pass -- treats both a
        # crash (1) and that 255 case as a clean bill of health. It fails OPEN
        # on the two outcomes that matter most.
        #
        # Hence: 0 is the ONLY pass. 2 is findings. Anything else is a tooling
        # failure and blocks, because "the scanner broke" and "the image is
        # clean" must never be the same outcome.
        # -------------------------------------------------------------------
        SCOUT_RC=0
        SCOUT_VERDICT=""
        run_scout_gate() { # run_scout_gate <logfile> <scout args...>
          local logfile="$1"; shift
          SCOUT_RC=0
          docker-scout "$@" >"$logfile" 2>&1 || SCOUT_RC=$?
          case "$SCOUT_RC" in
            0) SCOUT_VERDICT="pass" ;;
            2) SCOUT_VERDICT="findings" ;;
            *) SCOUT_VERDICT="error" ;;
          esac
          log "docker-scout exit=$SCOUT_RC -> $SCOUT_VERDICT"
        }

        scout_die() { # scout_die <what> <logfile>
          err "$1 -- docker-scout exited $SCOUT_RC (a tooling failure, NOT a clean bill of health):"
          sed 's/^/    /' "$2" >&2 || true
          summary "### ❌ Scan gate error"
          summary ""
          summary "\`docker-scout\` exited **$SCOUT_RC**. This is a tooling failure, not a passing scan."
          summary ""
          summary '```'
          summary "$(tail -20 "$2")"
          summary '```'
          die "$1"
        }

        # SARIF is read for DETAIL ONLY, never for the verdict, and always
        # defensively: Docker does not document how completely it populates the
        # schema, so a surprise there must degrade the report, not the gate.
        # Severity is not parsed at all -- every result is at or above
        # SCAN_SEVERITY by construction, because --only-severity filtered it.
        sarif_ids() { # sarif_ids <file> -> unique rule ids, one per line
          [[ -f "$1" ]] || return 0
          jq -r '[ (.runs // [])[] | (.results // [])[] | .ruleId // empty ] | unique | .[]' \
            "$1" 2>/dev/null || true
        }

        # -------------------------------------------------------------------
        # 1. SBOM inventory -- the fail-open guard.
        #
        # A clean scan of NOTHING looks identical to a clean scan of a real
        # image: both print no findings and exit 0. If SBOM extraction silently
        # yielded zero packages, the gate would wave through an unexamined
        # image. So the package count is asserted independently first. This also
        # runs fully offline, unlike `cves`, which makes it a genuine check
        # rather than a second opinion from the same call.
        # -------------------------------------------------------------------
        step "30a SBOM inventory (fail-open guard)"
        SBOM_JSON="$RUN_DIR/scout-sbom.json"
        if ! docker-scout sbom --format json --platform "$VERIFY_PLATFORM" \
               -o "$SBOM_JSON" "$SCAN_REF" >"$SBOM_JSON.log" 2>&1; then
          err "docker-scout sbom failed:"
          sed 's/^/    /' "$SBOM_JSON.log" >&2
          die "could not obtain an SBOM for $SCAN_REF -- refusing to gate on an unexamined image"
        fi

        PKG_TOTAL="$(jq -r '(.artifacts // []) | length' "$SBOM_JSON" 2>/dev/null || echo 0)"
        log "SBOM artifacts: $PKG_TOTAL"
        if [[ "$PKG_TOTAL" == "0" ]]; then
          die "SBOM contains ZERO packages -- a 'clean' scan of an empty inventory is not evidence. Refusing to promote."
        fi

        # Scout lists the Debian SOURCE package as its own artifact and links
        # each binary to it via .parent. That pairing is what makes DHI VEX
        # apply without remapping, so its presence is worth recording: a future
        # Scout release that stopped emitting it would show up here as a count
        # dropping to zero rather than as VEX quietly ceasing to suppress.
        PKG_WITH_PARENT="$(jq -r '[ (.artifacts // [])[] | select(.parent != null) ] | length' "$SBOM_JSON" 2>/dev/null || echo 0)"
        log "SBOM artifacts carrying a source .parent link: $PKG_WITH_PARENT"

        # -------------------------------------------------------------------
        # 2. Vulnerability scan -- two passes.
        #
        # Pass 1 is the BASELINE with VEX rejected: what an ordinary scanner
        # reports about a hardened image, and the number a customer is used to
        # seeing. Pass 2 is the GATE with the vendor's VEX applied (Scout pulls
        # it from the registry attestation itself -- no --vex-location, no
        # normalisation, no VEX Hub sync).
        #
        # skip-vex swaps which pass is authoritative: the identical digest is
        # gated on the unsuppressed result instead.
        # -------------------------------------------------------------------
        step "30b vulnerability scan"

        BASELINE_SARIF="$RUN_DIR/scout-cves-baseline.sarif.json"
        GATE_SARIF="$RUN_DIR/scout-cves.sarif.json"

        CVES_BASE_ARGS=(cves "$SCAN_REF" --platform "$VERIFY_PLATFORM"
                        --only-severity "$SCOUT_SEVERITY" --format sarif)

        log "pass 1/2: baseline (VEX rejected)"
        run_scout_gate "$RUN_DIR/scout-cves-baseline.log" \
          "${CVES_BASE_ARGS[@]}" "${VEX_REJECT_ARGS[@]}" -o "$BASELINE_SARIF" --exit-code
        if [[ "$SCOUT_VERDICT" == "error" ]]; then
          # The baseline is informational, so a failure here must not be
          # reported as a clean gate -- but it also must not mask the gate pass
          # below. Recorded and carried, not fatal.
          warn "baseline pass failed (exit $SCOUT_RC) -- suppression counts will be unavailable"
          sed 's/^/    /' "$RUN_DIR/scout-cves-baseline.log" >&2 || true
          BASELINE_OK=0
        else
          BASELINE_OK=1
        fi
        BASELINE_COUNT="$(sarif_ids "$BASELINE_SARIF" | grep -c . || true)"
        BASELINE_COUNT="${BASELINE_COUNT:-0}"

        log "pass 2/2: gate ($( (( SKIP_VEX )) && echo 'VEX REJECTED by skip-vex' || echo 'vendor VEX applied from attestation'))"
        GATE_VEX_ARGS=()
        (( SKIP_VEX )) && GATE_VEX_ARGS=("${VEX_REJECT_ARGS[@]}")
        run_scout_gate "$RUN_DIR/scout-cves.log" \
          "${CVES_BASE_ARGS[@]}" ${GATE_VEX_ARGS[@]+"${GATE_VEX_ARGS[@]}"} -o "$GATE_SARIF" --exit-code
        [[ "$SCOUT_VERDICT" == "error" ]] && scout_die "docker-scout cves could not scan $SCAN_REF" "$RUN_DIR/scout-cves.log"

        CVES_VERDICT="$SCOUT_VERDICT"
        CVES_RC="$SCOUT_RC"
        GATING_COUNT="$(sarif_ids "$GATE_SARIF" | grep -c . || true)"
        GATING_COUNT="${GATING_COUNT:-0}"

        sed 's/^/    /' "$RUN_DIR/scout-cves.log" >&2 || true

        # -------------------------------------------------------------------
        # Suppression accounting, by set difference.
        #
        # baseline minus gate = what the vendor's VEX set aside. Computed rather
        # than read from any scanner field, for the same reason the Trivy
        # implementation computed it: a "0 suppressed" that comes from a field
        # nobody populated is indistinguishable from VEX genuinely having
        # nothing to do, and it throws away the most informative number this
        # gate produces.
        # -------------------------------------------------------------------
        BASELINE_IDS="$RUN_DIR/cve-ids-baseline.txt"
        GATING_IDS="$RUN_DIR/cve-ids-gating.txt"
        sarif_ids "$BASELINE_SARIF" | sort -u >"$BASELINE_IDS"
        sarif_ids "$GATE_SARIF"     | sort -u >"$GATING_IDS"
        SUPPRESSED_IDS="$RUN_DIR/cve-ids-suppressed.txt"
        comm -23 "$BASELINE_IDS" "$GATING_IDS" >"$SUPPRESSED_IDS" || true
        SUPPRESSED_COUNT="$(grep -c . <"$SUPPRESSED_IDS" || true)"
        SUPPRESSED_COUNT="${SUPPRESSED_COUNT:-0}"

        log "findings without VEX (baseline) : $BASELINE_COUNT"
        log "suppressed by vendor VEX        : $SUPPRESSED_COUNT"
        log "findings gating the promotion   : $GATING_COUNT"

        # -------------------------------------------------------------------
        # Annotate suppressions with the vendor's own justification.
        #
        # Scout applies VEX without handing back the documents, so the
        # statements are read straight from the referrers -- the same place the
        # verify gate found them. This is presentation only: it never changes
        # the verdict, and a missing document costs a "not stated" cell rather
        # than the run. No normalisation happens here; that was a Trivy
        # workaround and Scout does not need it.
        # -------------------------------------------------------------------
        VEX_INDEX_FILE="$RUN_DIR/vex-index.json"
        printf '{}' >"$VEX_INDEX_FILE"
        INVENTORY="$RUN_DIR/inventory-quarantine.json"
        if [[ -f "$INVENTORY" ]] && (( SUPPRESSED_COUNT > 0 )); then
          while read -r digest; do
            [[ -n "$digest" ]] || continue
            raw="$(regctl artifact get "$QREPO@$digest" 2>/dev/null || true)"
            [[ -n "$raw" ]] || continue
            # Unwrap an in-toto Statement if that is what the referrer holds.
            doc="$(jq -c 'if type == "object" and has("predicate") and has("predicateType")
                          then .predicate else . end' <<<"$raw" 2>/dev/null || true)"
            [[ -n "$doc" ]] || continue
            _tmp="$(mktemp)"
            if jq -c --argjson v "$doc" '
                 . + ( ($v.statements // [])
                       | map({ key: (.vulnerability.name // .vulnerability // "?" | tostring),
                               value: { status, justification, impact_statement } })
                       | from_entries )' "$VEX_INDEX_FILE" >"$_tmp" 2>/dev/null; then
              mv "$_tmp" "$VEX_INDEX_FILE"
            else
              rm -f "$_tmp"
              warn "could not index VEX statements from referrer ${digest:0:19}... (justifications will read 'not stated')"
            fi
          done < <(jq -r '.artifacts[]? | select(.class == "vex-openvex") | .digest' "$INVENTORY" 2>/dev/null || true)
        fi
        VEX_DOC_STATEMENTS="$(jq -r 'length' "$VEX_INDEX_FILE" 2>/dev/null || echo 0)"
        log "VEX statements read from referrers (for justifications): $VEX_DOC_STATEMENTS"

        SUPPRESSED_FILE="$RUN_DIR/suppressed.json"
        jq -R -s --slurpfile vex "$VEX_INDEX_FILE" '
          [ split("\n")[] | select(length > 0)
            | { id: ., vex: ($vex[0][.] // null) } ]' "$SUPPRESSED_IDS" >"$SUPPRESSED_FILE"

        GATING_FILE="$RUN_DIR/gating-findings.json"
        jq -R -s '[ split("\n")[] | select(length > 0) | { id: . } ]' "$GATING_IDS" >"$GATING_FILE"

        # A VEX document that suppresses nothing is the failure mode worth
        # shouting about, and it is invisible in the numbers alone: "0
        # suppressed" reads identically whether VEX worked and had nothing to
        # do, or was never applied. So say which one it was. In a skip-vex run
        # this is also the self-check on --vex-author: if rejecting VEX changed
        # nothing, the negative test is not negative.
        if (( BASELINE_OK )) && (( SUPPRESSED_COUNT == 0 )); then
          if (( SKIP_VEX )); then
            log "skip-vex: baseline and gate are the same scan, so 0 suppressed is expected here"
          elif (( BASELINE_COUNT == 0 )); then
            log "VEX suppressed nothing: the baseline was already clean at $SCAN_SEVERITY"
            log "  (not evidence that VEX was applied -- there was nothing to apply it to)"
          elif [[ "$VEX_DOC_STATEMENTS" != "0" ]]; then
            warn "the image carries VEX statements but rejecting them changed NOTHING"
            warn "  ($BASELINE_COUNT finding(s) both with and without VEX)."
            warn "  Either Scout applied no VEX, or --vex-author does not reject attestation-sourced"
            warn "  VEX as this stage assumes -- in which case skip-vex is no longer a negative test."
            warn "  Verify with: docker-scout cves --only-vex-affected $SCAN_REF"
          else
            warn "no VEX statements found on this image and nothing was suppressed."
            warn "  A hardened image usually ships VEX; run the inspect-referrers workflow."
          fi
        fi

        if (( SUPPRESSED_COUNT > 0 )); then
          jq -r '.[] | "    SUPPRESSED  " + .id
                 + (if .vex then "  (" + (.vex.status // "?") + ")"
                      + (if .vex.justification then "\n                justification: " + .vex.justification else "" end)
                    else "" end)' "$SUPPRESSED_FILE" >&2
        fi
        if (( GATING_COUNT > 0 )); then
          sed 's/^/    GATING      /' "$GATING_IDS" >&2 || true
        fi

        # -------------------------------------------------------------------
        # 3. Rego policy gate -- policy/*.rego.
        #
        # Asserts the image is a Docker Hardened Image. See the METADATA block
        # in policy/dhi-provenance.rego for why this is written against the
        # com.docker.dhi.* markers rather than as a base-image allowlist: a DHI
        # has no base image, so Scout's built-in approved-base-images policy
        # reports "No data" on every tag this pipeline syncs.
        #
        # --policy-dir SUPPRESSES Scout's built-in policy set, deliberately:
        # this gate refuses on one explicit, version-controlled, offline-tested
        # assertion (tests/test-policy.sh), not on a vendor default set that
        # could change what promotion means without a commit in this repo.
        # -------------------------------------------------------------------
        step "30c Rego policy gate (policy/)"
        POLICY_RESULT="$RUN_DIR/policy-result.json"
        POLICY_LOG="$RUN_DIR/policy.log"
        POLICY_STATUS="skipped"
        POLICY_VIOLATIONS='[]'

        if [[ ! -d "$POLICY_DIR" ]]; then
          die "no policy directory at $POLICY_DIR -- the Rego gate cannot be skipped silently"
        fi

        POLICY_ARGS=(policy "$SCAN_REF" --platform "$VERIFY_PLATFORM"
                     --policy-dir "$POLICY_DIR" --result-file "$POLICY_RESULT" --exit-code)
        [[ -f "$POLICY_CONFIG" ]] && POLICY_ARGS+=(--policy-config "$POLICY_CONFIG")

        run_scout_gate "$POLICY_LOG" "${POLICY_ARGS[@]}"
        [[ "$SCOUT_VERDICT" == "error" ]] && scout_die "docker-scout policy could not evaluate $SCAN_REF" "$POLICY_LOG"
        POLICY_STATUS="$( [[ "$SCOUT_VERDICT" == "pass" ]] && echo pass || echo fail )"
        POLICY_RC="$SCOUT_RC"
        sed 's/^/    /' "$POLICY_LOG" >&2 || true

        # --result-file carries the full Rego evaluation: per-policy pass plus
        # the violation objects the policies built. Read defensively -- the
        # verdict already came from the exit code.
        if [[ -f "$POLICY_RESULT" ]]; then
          POLICY_VIOLATIONS="$(jq -c '[ .. | objects
                                        | select(has("message") and has("detail"))
                                        | {message, detail} ] | unique' \
                               "$POLICY_RESULT" 2>/dev/null || echo '[]')"
        fi
        POLICY_VIOL_COUNT="$(jq -r 'length' <<<"$POLICY_VIOLATIONS" 2>/dev/null || echo 0)"
        log "policy verdict: $POLICY_STATUS ($POLICY_VIOL_COUNT violation(s))"
        if (( POLICY_VIOL_COUNT > 0 )); then
          jq -r '.[] | "    VIOLATION   " + .message' <<<"$POLICY_VIOLATIONS" >&2 || true
        fi

        # -------------------------------------------------------------------
        # 4. docker-scout compare against what is in prod today.
        #
        # This is the view that replaces a manual pull-scan-eyeball workflow:
        # not "how many CVEs does this image have" but "what changes if I
        # promote it". Informational; never gates.
        # -------------------------------------------------------------------
        step "30d docker-scout compare vs prod"
        COMPARE_TXT="$RUN_DIR/scout-compare.txt"
        COMPARE_STATUS="skipped"
        PROD_TAG_REF="$(gar_ref prod)"

        if ! PROD_DIGEST="$(regctl manifest head "$PROD_TAG_REF" --require-digest 2>/dev/null)"; then
          log "nothing in prod at $PROD_TAG_REF yet -- first run, nothing to compare against"
          COMPARE_STATUS="no-baseline"
        elif [[ "$PROD_DIGEST" == "$INDEX_DIGEST" ]]; then
          log "prod already at $INDEX_DIGEST -- identical, comparison would be empty"
          COMPARE_STATUS="identical"
        else
          log "comparing $INDEX_DIGEST (candidate) against $PROD_DIGEST (prod)"
          if docker-scout compare --to "registry://$(gar_repo_path prod)@$PROD_DIGEST" \
               "$SCAN_REF" --platform "$VERIFY_PLATFORM" >"$COMPARE_TXT" 2>&1; then
            COMPARE_STATUS="ok"
            head -40 "$COMPARE_TXT" | sed 's/^/    /' >&2 || true
          else
            COMPARE_STATUS="failed"
            warn "docker-scout compare failed (informational, gate unaffected):"
            head -10 "$COMPARE_TXT" | sed 's/^/    /' >&2 || true
          fi
        fi

        # -------------------------------------------------------------------
        # 5. Report + gate decision
        #
        # BOTH halves must pass. The vulnerability scan and the policy
        # evaluation refuse for unrelated reasons and neither substitutes for
        # the other: a clean CVE list on an image that is not a DHI is not a
        # pass, and a genuine DHI carrying un-VEXed criticals is not either.
        # -------------------------------------------------------------------
        GATE_STATUS="pass"
        [[ "$CVES_VERDICT" == "pass" ]] || GATE_STATUS="fail"
        [[ "$POLICY_STATUS" == "pass" ]] || GATE_STATUS="fail"

        SCOUT_VERSION="$(docker-scout version 2>/dev/null | awk '/^version:/{print $2; exit}' || echo unknown)"

        jq -n \
          --arg gate "scan" \
          --arg status "$GATE_STATUS" \
          --arg at "$(_ts)" \
          --arg ref "$SCAN_REF" \
          --arg digest "$INDEX_DIGEST" \
          --arg platform "$VERIFY_PLATFORM" \
          --arg severity "$SCAN_SEVERITY" \
          --arg scoutVersion "$SCOUT_VERSION" \
          --argjson vexApplied "$(( SKIP_VEX ? 0 : 1 ))" \
          --argjson pkgTotal "$PKG_TOTAL" \
          --argjson pkgWithParent "$PKG_WITH_PARENT" \
          --argjson baselineOk "$BASELINE_OK" \
          --argjson baselineCount "$BASELINE_COUNT" \
          --argjson gatingCount "$GATING_COUNT" \
          --argjson suppressedCount "$SUPPRESSED_COUNT" \
          --argjson cvesRc "$CVES_RC" \
          --arg cvesVerdict "$CVES_VERDICT" \
          --argjson policyRc "$POLICY_RC" \
          --arg policyStatus "$POLICY_STATUS" \
          --argjson policyViolations "$POLICY_VIOLATIONS" \
          --slurpfile suppressedDetail "$SUPPRESSED_FILE" \
          --slurpfile findings "$GATING_FILE" \
          --arg compareStatus "$COMPARE_STATUS" \
          '{
             gate: $gate, status: $status, at: $at,
             target: { ref: $ref, digest: $digest, platform: $platform },
             scanner: { name: "docker-scout", version: $scoutVersion,
                        note: "CVE matching is server-side at api.dso.docker.com; there is no local vulnerability database and no offline mode. A scanner outage blocks promotion by design rather than passing it." },
             policy: { severity: $severity, vexApplied: ($vexApplied == 1),
                       gateFailsOn: "un-VEXed findings at the severity threshold, OR any Rego policy violation" },
             sbom: { artifacts: $pkgTotal, withSourceParent: $pkgWithParent,
                     note: "asserted non-zero before trusting a clean scan: a clean scan of an empty inventory is indistinguishable from a clean scan of a real image" },
             cves: { exitCode: $cvesRc, verdict: $cvesVerdict,
                     baselineFindings: $baselineCount,
                     baselineAvailable: ($baselineOk == 1),
                     gatingFindings: $gatingCount,
                     findings: $findings[0],
                     note: "verdict is taken from the documented exit code (0 clean / 2 findings) under a strict allowlist, NOT from parsing SARIF: docker scout cves has no --format json and the population of its SARIF is undocumented. baselineFindings is what a scanner reports with the vendor VEX rejected; gatingFindings is what remains after it and is what blocks promotion." },
             vex: { applied: ($vexApplied == 1),
                    suppressedCount: $suppressedCount,
                    suppressed: $suppressedDetail[0],
                    note: "Scout reads the VEX attestation from the registry itself; no --vex-location and no source-to-binary remapping are needed, because its SBOM carries both the Debian source package and its binaries linked by a parent edge. suppressedCount is computed as (baseline findings - findings surviving VEX)." },
             rego: { exitCode: $policyRc, status: $policyStatus,
                     violations: $policyViolations,
                     note: "policy/*.rego, evaluated by the OPA embedded in docker-scout. --policy-dir suppresses Scout built-in policies deliberately: promotion turns on assertions version-controlled and offline-tested in this repo." },
             scoutCompare: { status: $compareStatus }
           }' >"$REPORT"

        log "wrote ${REPORT#"$REPO_ROOT"/}"

        # Counts only in the manifest verdict: the full suppression and policy
        # detail lives in scan-report.json (and the evidence bundle). A DHI with
        # hundreds of VEX statements would push the detail JSON past the argv
        # ceiling on its way through gate_end.
        gate_end scan "$GATE_STATUS" \
          "$(jq -c '{cves: {baselineFindings: .cves.baselineFindings, gatingFindings: .cves.gatingFindings, exitCode: .cves.exitCode},
                     rego: {status: .rego.status, violations: (.rego.violations | length)},
                     vex: {applied: .vex.applied, suppressedCount: .vex.suppressedCount},
                     sbom: {artifacts: .sbom.artifacts},
                     policy}' "$REPORT")"

        if [[ "$GATE_STATUS" == "pass" ]]; then
          summary "### ✅ Scan gate passed"
        else
          summary "### ❌ Scan gate FAILED — promotion blocked"
        fi
        summary ""
        summary "| | |"
        summary "|---|---|"
        summary "| Image | \`$QREPO@$INDEX_DIGEST\` |"
        summary "| Scanner | docker-scout $SCOUT_VERSION |"
        summary "| Threshold | $SCAN_SEVERITY |"
        summary "| Packages in SBOM | $PKG_TOTAL |"
        if (( SKIP_VEX )); then VEX_CELL="**no** (skip-vex)"; else VEX_CELL="yes (from registry attestation)"; fi
        summary "| VEX applied | $VEX_CELL |"
        summary "| Findings without VEX (baseline) | $( (( BASELINE_OK )) && echo "$BASELINE_COUNT" || echo "_unavailable_") |"
        summary "| Suppressed by vendor VEX | $SUPPRESSED_COUNT |"
        summary "| **Gating findings** | **$GATING_COUNT** |"
        summary "| **Rego policy** | **$POLICY_STATUS** ($POLICY_VIOL_COUNT violation(s)) |"
        summary "| Scout compare | $COMPARE_STATUS |"

        if (( POLICY_VIOL_COUNT > 0 )); then
          summary ""
          summary "**Policy violations** — from \`policy/*.rego\`:"
          summary ""
          summary "| Violation | Detail |"
          summary "|---|---|"
          while read -r line; do summary "$line"; done < <(
            jq -r '.rego.violations[]
                   | "| " + (.message | gsub("\\|"; "\\\\|"))
                     + " | " + ((.detail | to_entries | map(.key + "=" + (.value | tostring)) | join(", ")) | gsub("\\|"; "\\\\|"))
                     + " |"' "$REPORT"
          )
        fi

        if (( SUPPRESSED_COUNT > 0 )); then
          summary ""
          summary "**Suppressed by the vendor's signed VEX** — assessed as not affecting this image:"
          summary ""
          summary "| CVE | Status | Justification |"
          summary "|---|---|---|"
          while read -r line; do summary "$line"; done < <(
            jq -r '.vex.suppressed[] | "| " + .id
                   + " | " + (if .vex then (.vex.status // "?") else "_not stated_" end)
                   + " | " + (if .vex then (.vex.justification // "_not stated_") else "_not stated_" end) + " |"' "$REPORT"
          )
        fi

        if (( GATING_COUNT > 0 )); then
          summary ""
          summary "**Un-VEXed findings at $SCAN_SEVERITY:**"
          summary ""
          summary "| CVE |"
          summary "|---|"
          while read -r line; do summary "$line"; done < <(
            jq -r '.cves.findings[] | "| " + .id + " |"' "$REPORT"
          )
        fi

        if [[ "$GATE_STATUS" != "pass" ]]; then
          step "30 scan: FAILED (cves=$CVES_VERDICT/$GATING_COUNT policy=$POLICY_STATUS/$POLICY_VIOL_COUNT)"
          die "scan gate failed -- image stays in quarantine, nothing promoted"
        fi

        step "30 scan: PASS"
